":"Steel"},{"type":"line","x":[0,0],"y":[-35,35],"color":"gray","dashed":true,"width":1},{"type":"line","x":[-10.3,0],"y":[30,0],"color":"blue","dashed":false,"width":2},{"type":"line","x":[0,30],"y":[0,-30],"color":"red","dashed":false,"width":2},{"type":"arrow","from":[-16,38],"to":[-10.3,30],"color":"green"},{"type":"text","xy":[-17,36],"text":"Tilted probe","color":"ink","size":9,"anchor":"end"},{"type":"text","xy":[3,14],"text":"19° in water","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[18,-8],"text":"45° shear in steel","color":"red","size":9,"anchor":"start"}]}}}],"faq":[{"q":"Why is the near field a problem for sizing?","e":"Think of ripples on a pond right next to where you drop a stone. They are messy. Further away they smooth out.\nInside the near field, the sound waves from different parts of the probe face add and cancel each other. The beam has strong and weak spots.\nSo the same flaw can give a big echo at one depth and a tiny echo at another. Echo height no longer tells you flaw size, which ruins amplitude-based sizing (DAC, AVG, comparing to a reference).\nRule: N = D² × f / (4 × v)\nExample: D = 10 mm, f = 5 MHz, v = 5.9 mm/µs (steel).\nN = 100 × 5 / (4 × 5.9) ≈ 21 mm.\nFix: size flaws beyond N. You can also use a smaller crystal or lower frequency (shorter N), a focused probe, or a delay line/water path to move the flaw out of the near field.","s":{"title":"Near field vs far field","xlim":[-30,30],"ylim":[-52,10],"equal":false,"items":[{"type":"rect","xy":[-30,-50],"w":60,"h":50,"color":"steel","label":""},{"type":"rect","xy":[-5,0],"w":10,"h":5,"color":"wedge","label":"Probe"},{"type":"line","x":[-5,-5,-12],"y":[0,-21,-50],"color":"blue","dashed":false,"width":2},{"type":"line","x":[5,5,12],"y":[0,-21,-50],"color":"blue","dashed":false,"width":2},{"type":"line","x":[-25,25],"y":[-21,-21],"color":"red","dashed":true,"width":2},{"type":"text","xy":[0,-10],"text":"Near field: uneven","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[0,-38],"text":"Far field: smooth","color":"green","size":9,"anchor":"middle"},{"type":"text","xy":[27,-25],"text":"N ≈ 21 mm","color":"ink","size":9,"anchor":"end"}]}},{"q":"What happens between the 1st and 2nd critical angles?","e":"Think of light going from air into water. Past a certain angle, one kind of beam stops getting through.\n\nBelow the 1st critical angle, steel gets both a longitudinal (L) wave and a shear (S) wave.\nAt the 1st critical angle, the L wave bends to 90° and skims along the surface.\nBetween the 1st and 2nd critical angles, only the shear wave goes into the steel. This is the useful window for angle-beam testing, because the screen shows one clean wave type.\nAt the 2nd critical angle, the shear wave also reaches 90°. Beyond it, you get surface waves only.\n\nFormula (Snell's law): sinθ1/V1 = sinθ2/V2\nExample, acrylic wedge (V ≈ 2.7 mm/µs) on steel (VL ≈ 5.9, VS ≈ 3.2 mm/µs):\n1st critical ≈ 27°\n2nd critical ≈ 57°\nA 45° wedge sits in between, so it gives a ~57° shear wave in the steel.","s":{"title":"Between critical angles: shear only","xlim":[-60,60],"ylim":[-50,30],"equal":true,"items":[{"type":"rect","xy":[-60,-50],"w":120,"h":50,"color":"steel","label":"Steel"},{"type":"rect","xy":[-50,0],"w":45,"h":25,"color":"wedge","label":"Wedge"},{"type":"line","x":[-10,-10],"y":[-35,22],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-30,20],"to":[-10,0],"color":"blue"},{"type":"arrow","from":[-10,0],"to":[23.5,-21.9],"color":"red"},{"type":"text","xy":[-28,24],"text":"Incident 45°","color":"blue","size":9,"anchor":"middle"},{"type":"text","xy":[28,-18],"text":"Shear ~57°","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[30,8],"text":"No L wave in steel","color":"amber","size":9,"anchor":"middle"}]}},{"q":"How does a DAC curve work?","e":"Think of a flashlight. A far-away object looks dimmer than the same object up close. Sound does the same. An identical flaw gives a smaller echo when it is deeper, because the beam spreads and the metal absorbs some sound.\n\nA DAC (Distance Amplitude Correction) curve fixes this unfair comparison.\n\n1. Use a reference block with identical reflectors, such as 3 mm side-drilled holes at 10, 25, 50 and 75 mm depth.\n2. With a 5 MHz probe, scan each hole and set the highest echo to a mark on the screen.\n3. Connect the marks. The line slopes down with depth.\n4. Scan the part. A flaw echo above the curve is at least as big as the reference hole. A flaw echo below the curve is smaller.\n\nRule: compare at the same depth, same probe, same gain. Acceptance usually uses a code level, such as 50% DAC or 100% DAC.\n\nTCG (time-corrected gain) does this electronically. It raises gain with time (µs), so the curve becomes flat.","s":{"title":"DAC curve","xlim":[-15,115],"ylim":[-18,110],"equal":false,"items":[{"type":"line","x":[0,100],"y":[0,0],"color":"ink","width":2},{"type":"line","x":[0,0],"y":[0,100],"color":"ink","width":2},{"type":"line","x":[10,25,50,75,100],"y":[90,70,48,33,22],"color":"blue","width":2},{"type":"circle","xy":[10,90],"r":2,"color":"blue","fill":true},{"type":"circle","xy":[50,48],"r":2,"color":"blue","fill":true},{"type":"circle","xy":[100,22],"r":2,"color":"blue","fill":true},{"type":"text","xy":[50,-10],"text":"Depth (mm)","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[-3,50],"text":"Amplitude %","color":"ink","size":9,"anchor":"end"},{"type":"text","xy":[60,78],"text":"DAC curve","color":"blue","size":9,"anchor":"start"},{"type":"circle","xy":[60,62],"r":2.5,"color":"red","fill":true},{"type":"text","xy":[66,62],"text":"Flaw above DAC","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[15,100],"text":"Reference holes","color":"gray","size":9,"anchor":"start"}]}},{"q":"Why does a 45° probe need a wedge of about 37°?","e":"Think of a car driving from pavement onto sand at an angle. The wheels slow down, so the car turns. Sound does the same when it passes from the wedge into steel.\nThe wedge is plastic (acrylic). Sound travels about 2730 m/s in it. Shear waves in steel travel about 3230 m/s. The wave speeds up, so it bends away from the normal. To get 45° in steel, the wedge angle must be smaller than 45°.\nSnell's law: sin θ1 / V1 = sin θ2 / V2\nsin θ1 = sin 45° × 2730 / 3230 = 0.598\nθ1 ≈ 37°\nWhy not another angle? Between about 27.6° (1st critical) and 57.7° (2nd critical), only a clean shear wave enters the steel. 37° sits in that window, so you get one 45° shear beam and no confusing longitudinal wave.","s":{"title":"37° in wedge gives 45° shear in steel","xlim":[-7,7],"ylim":[-6,5],"equal":true,"items":[{"type":"rect","xy":[-6,0],"w":6,"h":4.5,"color":"wedge","label":""},{"type":"rect","xy":[-7,-6],"w":14,"h":6,"color":"steel","label":""},{"type":"line","x":[0,0],"y":[4.5,-5],"color":"gray","dashed":true,"width":1},{"type":"line","x":[-3,0],"y":[4,0],"color":"blue","dashed":false,"width":2},{"type":"arrow","from":[0,0],"to":[4,-4],"color":"red"},{"type":"text","xy":[0.3,2.5],"text":"37°","color":"blue","size":10,"anchor":"start"},{"type":"text","xy":[0.3,-3.5],"text":"45°","color":"red","size":10,"anchor":"start"},{"type":"text","xy":[-5.8,3.7],"text":"Wedge 2730 m/s","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-6.8,-5.3],"text":"Steel shear 3230 m/s","color":"ink","size":9,"anchor":"start"}]}},{"q":"What is mode conversion?","e":"Mode conversion is when one type of sound wave turns into another at a boundary.\n\nThink of a ball hitting a slope. It does not just bounce. It can split and go in new directions.\n\nWhen a longitudinal (L) wave hits an interface at an angle, part of it changes into a shear (S) wave. Both waves reflect and refract. S waves travel slower (about 3200 m/s in steel) than L waves (about 5900 m/s).\n\nSnell's Law for each wave:\nsin θ₁ / V₁ = sin θ₂ / V₂\n\nBecause S is slower, it bends less than L. The picture shows a 20° wedge beam making an L wave at about 48° and an S wave at about 24° in steel.\n\nWhy it matters:\n• Between the 1st and 2nd critical angles, only the S wave stays in steel. This is how angle-beam probes work.\n• Past the 2nd critical angle, a surface wave is produced.\n• Unwanted converted waves can cause false echoes.","s":{"title":"Mode conversion at an interface","xlim":[-8,8],"ylim":[-7.5,8.5],"equal":true,"items":[{"type":"rect","xy":[-8,0],"w":16,"h":8,"color":"wedge"},{"type":"rect","xy":[-8,-7],"w":16,"h":7,"color":"steel"},{"type":"line","x":[0,0],"y":[-6.5,7.5],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-2.55,7],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[2.55,7],"color":"blue"},{"type":"arrow","from":[0,0],"to":[4.46,-4.0],"color":"red"},{"type":"arrow","from":[0,0],"to":[2.44,-5.48],"color":"green"},{"type":"text","xy":[-7.5,0.8],"text":"Wedge","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-7.5,-0.8],"text":"Steel","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-2.8,7.6],"text":"Incident L","color":"blue","size":9,"anchor":"end"},{"type":"text","xy":[2.8,7.6],"text":"Reflected L","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[4.8,-4.0],"text":"Refracted L","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[2.8,-6.2],"text":"Shear (S) wave","color":"green","size":9,"anchor":"start"}]}},{"q":"Why do we need couplant?","e":"Think of shouting through a closed window. Almost all the sound bounces back. Air between the probe and the steel does the same to ultrasound.\nEven a hair-thin air gap, or the rough surface of a part, stops nearly all the sound. Air is very 'soft' to sound and steel is very 'hard'. This big mismatch makes the sound reflect instead of crossing.\nCouplant (water, gel, oil) fills the tiny gaps. It gives the sound a path into the part.\n\nRule: the reflected share depends on acoustic impedance (Z = density × velocity).\nR = ((Z2 − Z1) / (Z2 + Z1))²\nAir–steel (0.0004 vs 46 MRayl): R ≈ 99.99%, so almost nothing gets in.\nWater–steel (1.5 vs 46 MRayl): about 12% of the energy gets in, and that is enough to work with.\nSo couplant is not optional. It is what lets the beam enter the part.","s":{"title":"Air gap vs couplant","xlim":[0,10],"ylim":[-6,4.5],"equal":false,"items":[{"type":"rect","xy":[0,-6],"w":10,"h":6,"color":"steel","label":"Steel"},{"type":"rect","xy":[1,1.2],"w":3,"h":2,"color":"wedge","label":"Probe"},{"type":"rect","xy":[1,0],"w":3,"h":1.2,"color":"air","label":"Air gap"},{"type":"rect","xy":[6,1.2],"w":3,"h":2,"color":"wedge","label":"Probe"},{"type":"rect","xy":[6,0],"w":3,"h":1.2,"color":"water","label":"Couplant"},{"type":"arrow","from":[2.5,1.2],"to":[2.5,0.1],"color":"red"},{"type":"text","xy":[2.5,-1.5],"text":"Sound blocked","color":"red","size":9,"anchor":"middle"},{"type":"arrow","from":[7.5,1.2],"to":[7.5,-4],"color":"green"},{"type":"text","xy":[7.5,-5],"text":"Sound enters","color":"green","size":9,"anchor":"middle"}]}},{"q":"What is the difference between longitudinal and shear waves?","e":"Think of a crowd.\n**Longitudinal (compression) wave:** Particles push and pull along the beam direction, like a Slinky squeezed and stretched. It travels in solids, liquids and gases. In steel it moves about 5.9 mm/µs.\n**Shear (transverse) wave:** Particles move side to side, across the beam direction, like shaking a rope. It needs a solid, because liquids can't carry it. In steel it moves about 3.2 mm/µs, roughly half the longitudinal speed.\n\nSame frequency, so shear has a shorter wavelength. At 5 MHz in steel: longitudinal is about 1.2 mm, shear about 0.65 mm. A shorter wavelength gives better sensitivity to small flaws.\n\nFormula: λ = v / f\n\nExam tip: angle-beam probes use shear waves, created by mode conversion at the wedge-to-steel interface. Straight-beam probes use longitudinal waves.","s":{"title":"Particle motion vs wave travel","xlim":[0,10],"ylim":[0,6.2],"equal":false,"items":[{"type":"text","xy":[0.3,5.7],"text":"Longitudinal: push-pull","color":"ink","size":10,"anchor":"start"},{"type":"arrow","from":[1,4.8],"to":[9,4.8],"color":"blue"},{"type":"arrow","from":[3,4.1],"to":[4.2,4.1],"color":"red"},{"type":"arrow","from":[6.2,4.1],"to":[5,4.1],"color":"red"},{"type":"text","xy":[5,3.4],"text":"Particles move along beam","color":"red","size":9,"anchor":"middle"},{"type":"line","x":[0,10],"y":[3.0,3.0],"color":"gray","dashed":true,"width":1},{"type":"text","xy":[0.3,2.6],"text":"Shear: side-to-side","color":"ink","size":10,"anchor":"start"},{"type":"arrow","from":[1,1.7],"to":[9,1.7],"color":"blue"},{"type":"arrow","from":[3,1.1],"to":[3,2.2],"color":"red"},{"type":"arrow","from":[6,2.2],"to":[6,1.1],"color":"red"},{"type":"text","xy":[5,0.4],"text":"Particles move across beam","color":"red","size":9,"anchor":"middle"}]}},{"q":"How do I calculate skip distance?","e":"Think of a ball bouncing off the floor. The sound goes down, hits the back wall, and comes back up. The spot where it lands on the top surface is one full skip.\n\nSteps:\n1. Find the beam angle θ in the steel, measured from the vertical (normal to the surface).\n2. Half skip = T × tan θ. This is the distance to the bottom bounce.\n3. Full skip = 2 × T × tan θ.\n\nExample: T = 25 mm, θ = 60°.\ntan 60° = 1.732\nHalf skip = 25 × 1.732 = 43.3 mm\nFull skip = 86.6 mm\n\nBeam path for one leg = T / cos θ = 25 / 0.5 = 50 mm.\n\nTip: measure distance from the beam exit point, not from the wedge front edge. Skip distance also changes with thickness. A thicker part gives a longer skip.","s":{"title":"Full skip distance in a plate","xlim":[0,100],"ylim":[-32,16],"equal":false,"items":[{"type":"rect","xy":[0,-25],"w":100,"h":25,"color":"steel","label":"Steel plate"},{"type":"rect","xy":[0,0],"w":10,"h":5,"color":"wedge","label":"Probe"},{"type":"line","x":[5,48.3,91.6],"y":[0,-25,0],"color":"blue","dashed":false,"width":2},{"type":"line","x":[48.3,48.3],"y":[0,-25],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[5,9],"to":[91.6,9],"color":"amber"},{"type":"arrow","from":[91.6,9],"to":[5,9],"color":"amber"},{"type":"text","xy":[48,12],"text":"Full skip = 86.6 mm","color":"amber","size":9,"anchor":"middle"},{"type":"text","xy":[50,-12],"text":"T = 25 mm","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[6,-8],"text":"θ = 60°","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[48.3,-29],"text":"Bottom bounce","color":"ink","size":8,"anchor":"middle"}]}}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("bank").textContent);
const TOPICS = DATA.topics, BANK = DATA.bank, LEVELS = ["I","II","III"], FAQ = DATA.faq || [];
const BKT = {init:.15, learn:.18, slip:.10, guess:.25};
const DAY = 864e5, HALF_LIFE = 45;          // confidence halves (toward the starting level) after 45 days without practice
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
};
const svgEl = html => { const d = el("div"); d.innerHTML = html.trim(); return d.firstChild; };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const rank = l => LEVELS.indexOf(l);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const fmt = (x, nd=1) => Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(nd);
const pct = x => Math.round(x*100) + "%";
const todayStr = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayNum = s => Math.round(new Date(s+"T12:00:00").getTime()/DAY);
const weekId = () => Math.floor((Date.now()/DAY + 3) / 7);
const SHORT = {"Wave physics":"Waves","Impedance & reflection":"Impedance","Refraction & critical angles":"Refraction","Near field & beam spread":"Near field","Decibels & attenuation":"dB","Angle-beam geometry":"Angle beam","Thickness & time of flight":"Thickness","Immersion testing":"Immersion","Transducers & equipment":"Probes","Calibration & sizing":"Calibration","Techniques & displays":"Displays"};

/* =============== student state (this device; mirrored to the team store in team mode) =============== */
const KEY = "ut-coach-v2";
function fresh(){ const m={},t={},a={},c={}; for (const x of TOPICS){ m[x]=BKT.init; t[x]=0; a[x]=0; c[x]=0; }
  return {v:2, level:"II", m, t, a, c, mistakes:{}, recent:[], xp:0, wk:weekId(), wkXp:0, streak:0, lastDay:"", daily:{day:"", n:0, ok:[]},
          screenOk:0, examBest:0, cert:"", pm:{}, procs:[], lastActive:0, seen:{}, hist:{}, exams:[], lastStudy:0}; }
let S = fresh();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) S = Object.assign(fresh(), JSON.parse(raw));
  else { const old = JSON.parse(localStorage.getItem("ut-coach-v1") || "null");           // carry over v1 progress
    if (old) { S.level = old.level || "II"; for (const x of TOPICS) { S.m[x] = old.mastery?.[x] ?? BKT.init; S.a[x] = old.attempts?.[x] || 0; S.c[x] = old.correct?.[x] || 0; if (S.a[x]) S.t[x] = Date.now(); } S.mistakes = old.mistakes || {}; } }
  for (const x of TOPICS) { if (S.m[x] == null) { S.m[x]=BKT.init; S.t[x]=0; S.a[x]=0; S.c[x]=0; } }
} catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} syncTeam(); }

const effOf = (m, t) => !t ? m : BKT.init + (m - BKT.init) * Math.pow(0.5, (Date.now() - t) / DAY / HALF_LIFE);
const eff = topic => effOf(S.m[topic], S.t[topic]);
const daysSince = t => t ? Math.floor((Date.now() - t) / DAY) : null;
const isDue = (m, t, a) => a > 0 && t && ((Date.now()-t)/DAY >= 21 || m - effOf(m, t) > 0.12);
const topicsFor = lv => TOPICS.filter(t => BANK.some(q => q.t === t && rank(q.l) <= rank(lv)));
const readiness = () => { const ts = topicsFor(S.level); return ts.reduce((s,t)=>s+eff(t),0)/ts.length; };

function bkt(p, ok){ const s=BKT.slip, g=BKT.guess; const post = ok ? p*(1-s)/(p*(1-s)+(1-p)*g) : p*s/(p*s+(1-p)*(1-g)); return post + (1-post)*BKT.learn; }

function nextTopic(){

    const m = eff(t), n = S.a[t];

    if (isDue(S.m[t], S.t[t], S.a[t])) x *= 1.4;

}

    v = v*v*v; const u = Math.random(); if (Math.log(u) < .5*x*x + d - d*v + d*Math.log(v)) return d*v; } }
const beta = (a,b) => { const x = gamma(a); return x/(x+gamma(b)); };

let lastQ = null;
function makeQuestion(topic){
  const gens = SCREEN.filter(g => g.t === topic && rank(g.l) <= rank(S.level));
  if (gens.length && Math.random() < 0.3) return pick(gens).make();
  let pool = BANK.filter(q => q.t === topic && rank(q.l) <= rank(S.level) && q !== lastQ);
  if (!pool.length) pool = BANK.filter(q => q.t === topic);

}

}
function myRecordSource(){ return Object.assign(memberBody(), {name: TEAM ? TEAM.name : "", email: TEAM ? TEAM.email : ""}); }

/* =============== ASK =============== */
let askBox = null, askDraft = "", faqOpen = null;
function askView(){
  const ta = el("textarea",{id:"ask-q",placeholder:"Ask any UT question, e.g. why does couplant matter?", oninput:e=>{askDraft=e.target.value;}});
  ta.value = askDraft;
  const go = () => { const v = ta.value.trim(); if (!v || !sample) return; askBox = el("div",{class:"claude-box"}); askClaude(`Student's current level: ${S.level}.\n\nStudent asks: ${v}`, askBox, new AbortController()); render(); };
  const faqList = el("div",{class:"panel",style:"gap:0"}, ...FAQ.map((f,i) => {
    const open = faqOpen === i, box = el("div",{class:"claude-box",style:"margin-block:4px 12px"});
    if (open) showPre(box, f);
    return el("div",{class:"review"}, el("button",{class:"faq-q","aria-expanded":String(open),onclick:()=>{ faqOpen = open ? null : i; render(); }}, f.q), open ? box : null);
  }));
  return [el("h2",{},"Ask UT coach"),
    el("p",{class:"muted",style:"margin:0"}, "Answers in plain English, usually with a sketch."),
    sample ? ta : null,
    sample ? el("button",{class:"btn primary", onclick: go}, "Ask") : null,
    !sample && FIREBASE_CONFIG ? el("div",{class:"banner"}, TEAM ? "Asking your own questions isn't switched on for your team yet. The common questions below are ready to read." : el("span",{}, "To ask your own questions, ", el("a",{href:"#", onclick:e=>{ e.preventDefault(); tab="team"; render(); window.scrollTo(0,0); }}, "sign in on the Team tab"), " with your team account. The common questions below are open to everyone.")) : null,
    askBox && askBox.childNodes.length ? el("div",{class:"panel"}, askBox) : null,
    el("h3",{class:"sec"}, "Common questions"),
    faqList,
    null];
}

/* =============== render =============== */
function render(){
  renderTabs(); drawGauge();
  const v = {today:todayView, practice:practiceView, lab:labView, team:teamView, ask:askView}[tab]();
  $("#view").replaceChildren(...v.filter(Boolean));
}
render();

</script>
