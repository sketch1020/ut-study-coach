<style>
/* Layout: one-column phone app. Sticky header with an A-scan readiness trace, content, fixed bottom tab bar. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunk:#e3e8ec; --ink:#17222b; --muted:#5b6975; --line:#d3dae0;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --surface:#172028; --sunk:#111a20; --ink:#e4ebf0; --muted:#93a2ae; --line:#2a3741;
  --accent:#f0a23b; --accent-ink:#1a1206; --signal:#62a9e6; --good:#52c283; --good-bg:#15301f; --bad:#ff7a6c; --bad-bg:#3a1a17;
  --steel:#55636f; --wedge:#a97d2c; --water:#2f6a9e; --air:#1d2730; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --surface:#172028; --sunk:#111a20; --ink:#e4ebf0; --muted:#93a2ae; --line:#2a3741;
  --accent:#f0a23b; --accent-ink:#1a1206; --signal:#62a9e6; --good:#52c283; --good-bg:#15301f; --bad:#ff7a6c; --bad-bg:#3a1a17;
  --steel:#55636f; --wedge:#a97d2c; --water:#2f6a9e; --air:#1d2730; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1}

.gauge{display:flex;align-items:center;gap:8px}

.level{display:flex;gap:4px;background:var(--sunk);border-radius:8px;padding:3px}

main{padding-block:16px;display:grid;gap:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:15px}

.bar .fill{height:100%;border-radius:4px}

h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}

.formula{display:grid;gap:2px;padding-block:10px;border-bottom:1px solid var(--line)}
.formula:last-child{border-bottom:0}
.formula span{font-size:14px;color:var(--muted)}
.formula code{font-family:var(--mono);font-size:15px;white-space:pre-wrap}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:grid}
.stat b{font-family:var(--mono);font-weight:500;font-size:28px}
.stat span{font-size:13px;color:var(--muted)}
.timer{font-family:var(--mono);font-size:16px}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}

.review{display:grid;gap:4px;padding-block:10px;border-bottom:1px solid var(--line);font-size:15px}
.review:last-child{border-bottom:0}
.note{font-size:13px;color:var(--muted)}
.faq-q{border:0;background:none;text-align:left;padding:4px 0;font-weight:700;width:100%;display:flex;justify-content:space-between;gap:10px}

.seg{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:3px}

.daily .btn.primary{justify-self:start}

.crow .now{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.crow .meta{grid-column:1/-1;font-size:12px;color:var(--muted)}
.crow .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.chip.due{border-color:var(--bad);color:var(--bad);font-weight:700}
.badges{display:flex;gap:8px;flex-wrap:wrap}

.badge.off{opacity:.45}
.badge.off i{background:var(--muted)}
.banner{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.team{border-collapse:collapse;font-size:13px;min-width:100%}

table.team td.name,table.team th.name{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.lb{display:grid;gap:6px}

.lbrow b{font-family:var(--mono);font-weight:500}

.scope{width:100%;display:block;border-radius:8px;background:#0c1410}
.lab svg.sim{width:100%;display:block;border-radius:10px;background:var(--sunk)}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}

.ctl output{font-family:var(--mono);min-width:64px;text-align:right}
select,input[type=date],input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.readout div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.readout b{display:block;font-family:var(--mono);font-weight:500;font-size:18px}
.readout span{font-size:12px;color:var(--muted)}
.status{font-weight:700}
.status.good{color:var(--good)} .status.bad{color:var(--bad)} .status.warn{color:var(--accent)}
.proc{display:grid;gap:4px;padding-block:10px;border-bottom:1px solid var(--line)}
.proc:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 4px 16px rgb(0 0 0 / .25)}
.xp{font-family:var(--mono);color:var(--good);font-weight:500}

.rp-head h1{margin:0;font-size:24px;color:#14181c}.rp-head p{margin:2px 0 0;color:#555}.rp-gen{color:#555;font-size:12px;white-space:nowrap}
.report h2{font-size:15px;margin:18px auto 6px;color:#14181c;text-transform:uppercase;letter-spacing:.05em}
.report table{border-collapse:collapse;width:100%;max-width:820px;display:table}
.rp-meta th,.rp-meta td{text-align:left;padding:4px 6px;border:1px solid #ccd;font-size:13px}.rp-meta th{background:#f1f3f5;width:16%;font-weight:600}
.rp th,.rp td{text-align:left;padding:5px 6px;border-bottom:1px solid #dde;font-size:13px;vertical-align:top}.rp th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#555}
.rp td:nth-child(n+2):not(:last-child){font-variant-numeric:tabular-nums;white-space:nowrap}
.rp-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-block:12px}
.rp-tiles div{border:1px solid #ccd;border-radius:8px;padding:8px 10px;display:grid}.rp-tiles b{font-size:20px;font-variant-numeric:tabular-nums}.rp-tiles span{font-size:12px;color:#555}
.rp-note{font-size:12px;color:#555;margin-top:16px}.rp-none{color:#555}
.rp-sign{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:36px;font-size:12px;color:#555}.rp-sign span{display:block;border-bottom:1px solid #14181c;height:36px;margin-bottom:4px}

@media print{ body.rp-open>*:not(#report){display:none!important} .report{position:static;padding:0;overflow:visible} .noprint{display:none!important} body.rp-open{overflow:visible;background:#fff;padding:0!important;margin:0!important;min-height:0!important} html{height:auto!important} .rp tr{break-inside:avoid} }
@media (max-width:520px){.rp th,.rp td{padding:4px 3px;font-size:12px}.rp th{font-size:10px}}
.fu{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}

.fu .chip:disabled{opacity:.5}
</style>

<script id="bank" type="application/json">{"topics":["Wave physics","Impedance & reflection","Refraction & critical angles","Near field & beam spread","Decibels & attenuation","Angle-beam geometry","Thickness & time of flight","Immersion testing","Transducers & equipment","Calibration & sizing","Techniques & displays"],"bank":[{"t":"Wave physics","l":"I","k":"calc","q":"What is the wavelength of a 10 MHz shear wave in stainless steel?\n(v_L = 5.74 mm/µs, v_S = 3.1 mm/µs)","o":[["31.0 mm",0,"You multiplied. Wavelength = velocity / frequency (λ = v / f)."],["0.31 mm",1,""],["3.23 mm",0,"You divided the frequency by the velocity. Wavelength = velocity / frequency."],["0.57 mm",0,"You used the longitudinal velocity. A shear wave travels at v = 3.1 mm/µs."]],"s":"λ = v / f = 3.1 mm/µs ÷ 10 MHz = 0.310 mm.\n(mm/µs ÷ MHz = mm, because 1 MHz = 1/µs.)","h":"λ = v / f. Pick the velocity that matches the wave mode.","d":null,"x":{"e":"Wavelength is the length of one full wave, like the distance between two ocean wave crests.\nThe wave moves at a speed (v). It makes f waves every second. So the length of one wave is speed divided by waves per second.\n\nFormula: λ = v / f\nShear wave in stainless steel: v = 3.1 mm/µs, f = 10 MHz = 10 cycles/µs.\nλ = 3.1 ÷ 10 = 0.31 mm (answer B).\n\nSanity check: at 10 MHz the wave is very short, so the answer should be a fraction of a millimetre.\n\nCommon trap: D (0.57 mm). That comes from using the longitudinal speed, 5.74 ÷ 10 = 0.574 mm. Shear waves are slower (about half), so their wavelength is shorter. Always check the wave mode first.\nOther slips: C comes from flipping the formula (10 ÷ 3.1), and A from multiplying (3.1 × 10) instead of dividing.","s":{"title":"10 MHz shear wave: one wavelength","xlim":[-0.05,0.7],"ylim":[-0.3,0.35],"equal":false,"items":[{"type":"line","x":[0,0.03875,0.0775,0.11625,0.155,0.19375,0.2325,0.27125,0.31,0.34875,0.3875,0.42625,0.465,0.50375,0.5425,0.58125,0.62],"y":[0,0.0707,0.1,0.0707,0,-0.0707,-0.1,-0.07 le":"One cycle = one wavelength","xlim":[-0.3,1.9],"ylim":[-1.4,1.3],"equal":false,"items":[{"type":"text","xy":[0.79,1.1],"text":"4 MHz, v = 6.32 mm/µs","color":"ink","size":9,"anchor":"middle"},{"type":"line","x":[0,0.099,0.198,0.296,0.395,0.494,0.593,0.691,0.79,0.889,0.988,1.086,1.185,1.284,1.383,1.481,1.58],"y":[0,0.153,0.283,0.37,0.4,0.37,0.283,0.153,0,-0.153,-0.283,-0.37,-0.4,-0.37,-0.283,-0.153,0],"color":"blue","dashed":false,"width":2},{"type":"line","x":[0,0],"y":[-0.5,-0.9],"color":"gray","dashed":true,"width":1},{"type":"line","x":[1.58,1.58],"y":[-0.5,-0.9],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[0.79,-0.7],"to":[0,-0.7],"color":"red"},{"type":"arrow","from":[0.79,-0.7],"to":[1.58,-0.7],"color":"red"},{"type":"text","xy":[0.79,-1.0],"text":"λ = 6.32 ÷ 4 = 1.58 mm","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[0.79,-1.25],"text":"Not × 4 (25.3 mm)","color":"amber","size":8,"anchor":"middle"}]}}},{"t":"Wave physics","l":"I","k":"calc","q":"What is the wavelength of a 1 MHz shear wave in copper?\n(v_L = 4.66 mm/µs, v_S = 2.26 mm/µs)","o":[["4.66 mm",0,"You used the longitudinal velocity. A shear wave travels at v = 2.26 mm/µs."],["3.10 mm",0,"That value does not follow from the formula - re-check the steps."],["2.26 mm",1,""],["0.44 mm",0,"You divided the frequency by the velocity. Wavelength = velocity / frequency."]],"s":"λ = v / f = 2.26 mm/µs ÷ 1 MHz = 2.260 mm.\n(mm/µs ÷ MHz = mm, because 1 MHz = 1/µs.)","h":"λ = v / f. Pick the velocity that matches the wave mode.","d":null,"x":{"e":"Think of a wave as a line of people doing 'the wave' in a stadium. Wavelength is the distance from one crest to the next.\nAt 1 MHz, one cycle takes 1 µs. In that 1 µs, a shear wave in copper travels 2.26 mm. So one wavelength is 2.26 mm.\nFormula: λ = v ÷ f = 2.26 mm/µs ÷ 1 MHz = 2.26 mm.\n(1 MHz = 1 cycle per µs, so mm/µs ÷ MHz gives mm.)\nTraps:\n• Option A (4.66 mm) uses the longitudinal velocity. The question says shear, so use v_S.\n• Option D (0.44 mm) is 1 ÷ 2.26. That divides the wrong way round. Distance = speed × time, and wavelength is speed divided by frequency.\nTip: check the units, and read the wave mode first.","s":{"title":"Shear wave, 1 MHz in copper","xlim":[-0.3,5.2],"ylim":[-2.3,2.0],"equal":false,"items":[{"type":"line","x":[0,0.565,1.13,1.695,2.26,2.825,3.39,3.955,4.52],"y":[0,0.5,0,-0.5,0,0.5,0,-0.5,0],"color":"green","dashed":false,"width":2},{"type":"line","x":[0.565,0.565],"y":[0.5,1.0],"color":"gray","dashed":true,"width":1},{"type":"line","x":[2.825,2.825],"y":[0.5,1.0],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[0.565,1.0],"to":[2.825,1.0],"color":"blue"},{"type":"arrow","from":[2.825,1.0],"to":[0.565,1.0],"color":"blue"},{"type":"text","xy":[1.695,1.35],"text":"λ = 2.26 mm (shear)","color":"blue","size":10,"anchor":"middle"},{"type":"text","xy":[2.3,1.75],"text":"1 cycle = 1 µs","color":"ink","size":9,"anchor":"middle"},{"type":"arrow","from":[0,-1.3],"to":[4.66,-1.3],"color":"red"},{"type":"arrow","from":[4.66,-1.3],"to":[0,-1.3],"color":"red"},{"type":"text","xy":[2.33,-1.75],"text":"4.66 mm = longitudinal (trap A)","color":"red","size":9,"anchor":"middle"}]}}},{"t":"Wave physics","l":"I","k":"calc","q":"What is the wavelength of a 5 MHz shear wave in copper?\n(v_L = 4.66 mm/µs, v_S = 2.26 mm/µs)","o":[["0.93 mm",0,"You used the longitudinal velocity. A shear wave travels at v = 2.26 mm/µs."],["11.3 mm",0,"You multiplied. Wavelength = velocity / frequency (λ = v / f)."],["2.21 mm",0,"You divided the frequency by the velocity. Wavelength = velocity / frequency."],["0.45 mm",1,""]],"s":"λ = v / f = 2.26 mm/µs ÷ 5 MHz = 0.452 mm.\n(mm/µs ÷ MHz = mm, because 1 MHz = 1/µs.)","h":"λ = v / f. Pick the velocity that matches the wave mode.","d":null,"x":{"e":"Think of a wave as a line of ripples moving along. Wavelength (λ) is the distance from one ripple to the next.\nIf the ripples travel at speed v and 5 million of them pass every second, each ongitudinal wave in steel?\n(v_L = 5.92 mm/µs, v_S = 3.23 mm/µs)","o":[["5.92 mm",1,""],["3.23 mm",0,"You used the shear velocity. A longitudinal wave travels at v = 5.92 mm/µs."],["8.11 mm",0,"That value does not follow from the formula - re-check the steps."],["0.17 mm",0,"You divided the frequency by the velocity. Wavelength = velocity / frequency."]],"s":"λ = v / f = 5.92 mm/µs ÷ 1 MHz = 5.920 mm.\n(mm/µs ÷ MHz = mm, because 1 MHz = 1/µs.)","h":"λ = v / f. Pick the velocity that matches the wave mode.","d":null,"x":{"e":"Think of a wave like ocean swells passing a buoy. Wavelength is the distance from one crest to the next.\n\nIn 1 µs the sound travels 5.92 mm in steel. A 1 MHz wave makes exactly 1 crest per µs. So one full wave is 5.92 mm long.\n\nRule: λ = v ÷ f = 5.92 mm/µs ÷ 1 MHz = 5.92 mm.\n(mm/µs ÷ MHz works because 1 MHz = 1 cycle per µs.)\n\nCommon trap: the question gives two speeds. B (3.23 mm) uses the shear speed, but the question says longitudinal, so use 5.92. Another slip is flipping the formula to f ÷ v, or 1 ÷ 5.92, which gives D (0.17 mm).\n\nQuick check: a higher frequency means a shorter wavelength. Faster sound means a longer wavelength.","s":{"title":"1 MHz longitudinal wave in steel","xlim":[-1,13],"ylim":[-3.5,3.5],"equal":false,"items":[{"type":"rect","xy":[-0.5,-2.5],"w":13,"h":5,"color":"steel","label":""},{"type":"line","x":[0,0.74,1.48,2.22,2.96,3.7,4.44,5.18,5.92,6.66,7.4,8.14,8.88,9.62,10.36,11.1,11.84],"y":[0,0.71,1,0.71,0,-0.71,-1,-0.71,0,0.71,1,0.71,0,-0.71,-1,-0.71,0],"color":"blue","dashed":false,"width":2},{"type":"line","x":[1.48,1.48],"y":[1,1.9],"color":"gray","dashed":true,"width":1},{"type":"line","x":[7.4,7.4],"y":[1,1.9],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[4.44,1.7],"to":[1.48,1.7],"color":"red"},{"type":"arrow","from":[4.44,1.7],"to":[7.4,1.7],"color":"red"},{"type":"text","xy":[4.44,2.2],"text":"λ = 5.92 mm (crest to crest)","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[6 .1 ÷ 5, the LONGITUDINAL speed. The question says shear, so use the slower speed. A slower wave gets squeezed into a shorter wavelength, about half here.\n\nOther traps: C (15.6) multiplies v × f. D (1.60) flips the division, f ÷ v. Quick check: mm/µs ÷ 1/µs = mm, and the answer should be smaller than the speed number, so division is right.","s":{"title":"Same 5 MHz, different wavelength","xlim":[-0.1,3.3],"ylim":[-2.1,2.5],"equal":false,"items":[{"type":"line","x":[0,0.156,0.312,0.468,0.624,0.78,0.936,1.092,1.248],"y":[1.5,1.9,1.5,1.1,1.5,1.9,1.5,1.1,1.5],"color":"blue","dashed":false,"width":2},{"type":"arrow","from":[0,0.8],"to":[0.624,0.8],"color":"blue"},{"type":"arrow","from":[0.624,0.8],"to":[0,0.8],"color":"blue"},{"type":"text","xy":[0.31,0.45],"text":"λ shear = 0.62 mm","color":"blue","size":9,"anchor":"middle"},{"type":"text","xy":[1.4,1.5],"text":"Shear 3.12 mm/µs (correct)","color":"blue","size":9,"anchor":"start"},{"type":"line","x":[0,0.305,0.61,0.915,1.22],"y":[-0.5,-0.1,-0.5,-0.9,-0.5],"color":"red","dashed":true,"width":2},{"type":"arrow","from":[0,-1.4],"to":[1.22,-1.4],"color":"red"},{"type":"arrow","from":[1.22,-1.4],"to":[0,-1.4],"color":"red"},{"type":"text","xy":[0.61,-1.8],"text":"λ long = 1.22 mm (trap)","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[1.4,-0.5],"text":"Longitudinal 6.1 mm/µs","color":"red","size":9,"anchor":"start"}]}}},{"t":"Thickness & time of flight","l":"I","k":"calc","q":"A straight-beam back-wall echo in stainless steel arrives 17.42 µs after the initial pulse (pulse-echo, contact). What is the thickness? (v_L = 5.74 mm/µs)","o":[["1.52 mm",0,"You divided time by velocity. Distance = velocity × time."],["50.0 mm",1,""],["27.0 mm",0,"You used the shear velocity; a straight beam is a longitudinal wave."],["100.0 mm",0,"You forgot the round trip. In pulse-echo the sound goes down AND back, so divide by 2."]],"s":"Pulse-echo: the sound travels the thickness twice.\nd = v · t / 2 = 5.74 × 17.42 / 2 = 50.0 mm.","h":"Distance = velocity × time - and remember pulse-echo is a round trip.","d":null,"x":{"e":"Think of shouting at a cliff and hearing the echo. The sound goes to the cliff AND comes back. The 17.42 µs is the whole round trip.\n\nStep 1: Total path = v × t = 5.74 × 17.42 ≈ 100 mm.\nStep 2: That 100 mm is down plus back up, so divide by 2.\nStep 3: d = v·t / 2 = 100 / 2 = 50.0 mm.\n\nMost common trap: option D (100.0 mm). It forgets the \"/2\" and gives the total sound path instead of the thickness. Always ask: \"Did the sound cross the part once or twice?\" In pulse-echo, it is twice.\n\nRule: d = v · t / 2","s":{"title":"Round trip = 2 × thickness","xlim":[-15,55],"ylim":[-70,15],"equal":false,"items":[{"type":"rect","xy":[-10,-50],"w":60,"h":50,"color":"steel","label":""},{"type":"rect","xy":[14,0],"w":12,"h":8,"color":"wedge","label":"Probe"},{"type":"arrow","from":[16,0],"to":[16,-50],"color":"blue"},{"type":"arrow","from":[24,-50],"to":[24,0],"color":"red"},{"type":"text","xy":[14,-25],"text":"Down 50 mm","color":"blue","size":9,"anchor":"end"},{"type":"text","xy":[26,-25],"text":"Back 50 mm","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[20,-56],"text":"Back wall","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[20,-64],"text":"Total 100 mm, so d = 50 mm","color":"green","size":9,"anchor":"middle"}]}}},{"t":"Thickness & time of flight","l":"I","k":"calc","q":"A straight-beam back-wall echo in aluminum arrives 3.80 µs after the initial pulse (pulse-echo, contact). What is the thickness? (v_L = 6.32 mm/µs)","o":[["5.95 mm",0,"You used the shear velocity; a straight beam is a longitudinal wave."],["12.0 mm",1,""],["24.0 mm",0,"You forgot the round trip. In pulse-echo the sound goes down AND back, so divide by 2."],["0.30 mm",0,"You divided time by velocity. Distance = velocity × time."]],"s":"Pulse-echo: the sound travels the thickness twice.\nd = v · t / 2 = 6.32 × 3.80 / 2 = 12.0 mm.","h":"Distance = velocity × time - and remember pulse-echo is a round trip.","d":null,"x":{"e":"Think of shouting at a cliff and hearing the echo. The echo time covers the trip there AND back.\n\nThe 3.80 µs on the screen is the round trip. The sound goes down to the back wall, bounces, and returns to the probe. The thickness is only the one-way part, so we must halve the path.\n\nStep 1: Total path = v × t = 6.32 × 3.80 ≈ 24.0 mm.\nStep 2: Thickness = path ÷ 2 = 12.0 mm.\n\nFormula: d = v·t / 2\n\nCommon trap: Option C (24.0 mm). It is the total round-trip path. Students multiply v × t and forget to divide by 2. Always ask: \"Did the sound travel this distance once or twice?\" In pulse-echo, it is twice.\n\nOptions A and D come from mixing up the formula (for example, dividing instead of multiplying). Check your units: mm/µs × µs = mm.","s":{"title":"Pulse-echo: sound travels the thickness twice","xlim":[-10,10],"ylim":[-16,5],"equal":false,"items":[{"type":"rect","xy":[-6,-12],"w":12,"h":12,"color":"steel","label":"Aluminum 12 mm"},{"type":"rect","xy":[-1.5,0],"w":3,"h":1.8,"color":"wedge","label":"Probe"},{"type":"arrow","from":[-0.8,0],"to":[-0.8,-11.8],"color":"blue"},{"type":"arrow","from":[0.8,-11.8],"to":[0.8,-0.1],"color":"red"},{"type":"text","xy":[-1.5,-6],"text":"Down 12 mm","color":"blue","size":9,"anchor":"end"},{"type":"text","xy":[1.5,-6],"text":"Back 12 mm","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[0,-13],"text":"Back wall","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[0,-15],"text":"Total 24 mm = 3.80 µs, so d = 12 mm","color":"green","size":9,"anchor":"middle"}]}}},{"t":"Thickness & time of flight","l":"I","k":"calc","q":"A straight-beam back-wall echo in copper arrives 27.25 µs after the initial pulse (pulse-echo, contact). What is the thickness? (v_L = 4.66 mm/µs)","o":[["2.92 mm",0,"You divided time by velocity. Distance = velocity × time."],["127 mm",0,"You forgot the round trip. In pulse-echo the sound goes down AND back, so divide by 2."],["30.8 mm",0,"You used the shear velocity; a straight beam is a longitudinal wave."],["63.5 mm",1,""]],"s":"Pulse-echo: the sound travels the thickness twice.\nd = v · t / 2 = 4.66 × 27.25 / 2 = 63.5 mm.","h":"Distance = velocity × time - and remember pulse-echo is a round trip.","d":null,"x":{"e":"Think of shouting at a cliff and hearing the echo. The sound goes there AND back, so the time you measure covers two trips.\nThe 27.25 µs is the round trip. The sound crosses the copper down to the back wall, then travels up again.\nStep 1: total path = v × t = 4.66 × 27.25 = 127 mm.\nStep 2: that is twice the thickness, so divide by 2.\nd = v·t / 2 = 127 / 2 = 63.5 mm (answer D).\nMost common trap: B (127 mm). That is the total path, and the student forgot to halve it. Always ask: \"Did I already count the trip back?\"\nOption A (2.92 mm) comes from dividing time by velocity, which flips the formula. Check units: mm/µs × µs = mm.\nRule: pulse-echo thickness = velocity × time ÷ 2.","s":{"title":"Pulse-echo: sound travels d twice","xlim":[0,10],"ylim":[-8.5,2],"equal":false,"items":[{"type":"rect","xy":[0,-6],"w":10,"h":6,"color":"steel"},{"type":"rect","xy":[3.5,0],"w":3,"h":1,"color":"wedge","label":"Probe"},{"type":"arrow","from":[4.4,0],"to":[4.4,-6],"color":"blue"},{"type":"arrow","from":[5.6,-6],"to":[5.6,0],"color":"red"},{"type":"text","xy":[4.1,-3],"text":"Down: d","color":"blue","size":9,"anchor":"end"},{"type":"text","xy":[5.9,-3],"text":"Back: d","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[9.7,-0.8],"text":"Copper","color":"ink","size":9,"anchor":"end"},{"type":"text","xy":[5,-6.8],"text":"Back wall","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[5,-7.8],"text":"Path 127 mm = 2d, so d = 63.5 mm","color":"green","size":9,"anchor":"middle"}]}}},{"t":"Thickness & time of flight","l":"I","k":"calc","q":"A straight-beam back-wall echo in copper arrives 42.92 µs after the initial pulse (pulse-echo, contact). What is the thickness? (v_L = 4.66 ses the shear velocity (about 3.23 mm/µs) instead of the longitudinal one. D (2.14 mm) divides time by velocity instead of multiplying.","s":{"title":"Pulse-echo: sound goes down and back","xlim":[-5,100],"ylim":[-92,15],"equal":false,"items":[{"type":"rect","xy":[0,-75],"w":40,"h":75,"color":"steel","label":"Steel"},{"type":"rect","xy":[14,0],"w":12,"h":7,"color":"wedge","label":"Probe"},{"type":"arrow","from":[17,0],"to":[17,-75],"color":"blue"},{"type":"arrow","from":[23,-75],"to":[23,0],"color":"red"},{"type":"text","xy":[20,-84],"text":"Back wall","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[46,-20],"text":"Down: 75 mm (blue)","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[46,-35],"text":"Up: 75 mm (red)","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[46,-52],"text":"Total 150 mm in 25.34 µs","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[46,-67],"text":"Thickness = 150 / 2 = 75 mm","color":"green","size":9,"anchor":"start"}]}}},{"t":"Thickness & time of flight","l":"I","k":"calc","q":"A straight-beam back-wall echo in copper arrives 8.15 µs after the initial pulse (pulse-echo, contact). What is the thickness? (v_L = 4.66 mm/µs)","o":[["9.21 mm",0,"You used the shear velocity; a straight beam is a longitudinal wave."],["19.0 mm",1,""],["0.87 mm",0,"You divided time by velocity. Distance = velocity × time."],["38.0 mm",0,"You forgot the round trip. In pulse-echo the sound goes down AND back, so divide by 2."]],"s":"Pulse-echo: the sound travels the thickness twice.\nd = v · t / 2 = 4.66 × 8.15 / 2 = 19.0 mm.","h":"Distance = velocity × time - and remember pulse-echo is a round trip.","d":null,"x":{"e":"Think of shouting at a cliff and hearing the echo. The sound goes to the cliff AND back. The clock counts both trips.\nIn the copper, the pulse goes down to the back wall, then returns to the probe. The 8.15 µs is the time for the round trip.\n\nStep 1: Total path = v × t = 4.66 mm/µs × 8.15 µs = 38.0 mm.\nStep 2: That is two trips, so divide by 2: 38.0 / 2 = 19.0 mm.\n\nFormula: d = v · t / 2\n\nCommon trap: D (38.0 mm). It is the total round-trip path. You forgot to halve it.\nAlso, C (0.87 mm) comes from dividing time by velocity (t / v / 2). That is upside down. Check units: mm/µs × µs = mm.","s":{"title":"Pulse-echo: sound travels twice","xlim":[0,10],"ylim":[-5.5,2],"equal":false,"items":[{"type":"rect","xy":[2,-4],"w":6,"h":4,"color":"steel"},{"type":"rect","xy":[4.2,0],"w":1.6,"h":0.7,"color":"wedge"},{"type":"text","xy":[5,1.3],"text":"Probe","color":"ink","size":9,"anchor":"middle"},{"type":"arrow","from":[4.5,0],"to":[4.5,-3.9],"color":"blue"},{"type":"arrow","from":[5.5,-3.9],"to":[5.5,0],"color":"red"},{"type":"text","xy":[4.3,-2],"text":"Down 19.0 mm","color":"blue","size":9,"anchor":"end"},{"type":"text","xy":[5.7,-2],"text":"Back 19.0 mm","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[5,-4.7],"text":"Back wall: total 38.0 mm = 8.15 µs","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Near field & beam spread","l":"II","k":"calc","q":"A 12.7 mm diameter, 10 MHz straight-beam probe is used on aluminum (v = 6.32 mm/µs). How long is the near field?","o":[["5.02 mm",0,"You did not square the diameter. N = D² / (4λ)."],["63.8 mm",1,""],["16.0 mm",0,"You put the radius into the diameter formula. With the radius it is N = r² / λ."],["255 mm",0,"You left out the 4. N = D² / (4λ)  (or N = D² f / 4v)."]],"s":"λ = v / f = 6.32 / 10 = 0.632 mm\nN = D² / (4λ) = 12.7² / (4 × 0.632) = 63.8 mm.","h":"N = D² / (4λ) with λ = v / f.","d":null,"x":{"e":"Think of a flashlight with a messy, bumpy beam right at the lens. Further away the beam smooths out and then fans out. The near field is that messy zone in front of the probe. Its length depends on how wide the probe is and how short the wavelength is.\n\nStep 1: wavelength λ = v / f = 6.32 / 10 = 0.632 mm.\nStep 2: N = D² / (4λ) = 12.7² / (4 × 0.632) = 161.29 / 2.528 = 63.8 mm.\n\nSo the answer is B. A big probe and a high frequency (short λ) give a long near field.\n\nCommon trap: forgetting the 4. D²/λ = 255 mm, which is option D. The other options come from dividing by the wrong numbers (for example, an extra factor of 4 gives about 16 mm). Always check that the answer is much longer than the probe diameter. Here that means tens of mm, not 5 mm.","s":{"title":"Near field of a 12.7 mm, 10 MHz probe in aluminum","xlim":[-40,40],"ylim":[-105,15],"equal":false,"items":[{"type":"rect","xy":[-35,-100],"w":70,"h":100,"color":"steel","label":"Aluminum"},{"type":"rect","xy":[-6.35,0],"w":12.7,"h":8,"color":"wedge","label":"Probe"},{"type":"line","x":[-6.35,-6.35],"y":[0,-63.8],"color":"blue","dashed":false,"width":2},{"type":"line","x":[6.35,6.35],"y":[0,-63.8],"color":"blue","dashed":false,"width":2},{"type":"line","x":[-6.35,-18],"y":[-63.8,-100],"color":"red","dashed":true,"width":2},{"type":"line","x":[6.35,18],"y":[-63.8,-100],"color":"red","dashed":true,"width":2},{"type":"line","x":[-25,25],"y":[-63.8,-63.8],"color":"amber","dashed":true,"width":1},{"type":"arrow","from":[14,0],"to":[14,-63.8],"color":"amber"},{"type":"text","xy":[16,-32],"text":"N = 63.8 mm","color":"amber","size":9,"anchor":"start"},{"type":"text","xy":[-9,-30],"text":"Near field","color":"ink","size":9,"anchor":"end"},{"type":"text","xy":[-15,-88],"text":"Far field: spreads","color":"red","size":9,"anchor":"end"}]}}},{"t":"Near field & beam spread","l":"II","k":"calc","q":"A 6 mm diameter, 5 MHz straight-beam probe is used on steel (v = 5.92 mm/µs). How long is the near field?","o":[["30.4 mm",0,"You left out the 4. N = D² / (4λ)  (or N = D² f / 4v)."],["7.60 mm",1,""],["1.27 mm",0,"You did not square the diameter. N = D² / (4λ)."],["1.90 mm",0,"You put the radius into the diameter formula. With the radius it is N = r² / λ."]],"s":"λ = v / f = 5.92 / 5 = 1.184 mm\nN = D² / (4λ) = 6² / (4 × 1.184) = 7.6 mm.","h":"N = D² / (4λ) with λ = v / f.","d":null,"x":{"e":"Think of a flashlight: close up, the light is messy and uneven. Farther away, it becomes smooth and slowly spreads out. The near field is that messy zone right in front of the probe, and its length is N.\n\nStep 1: wavelength. λ = v / f = 5.92 / 5 = 1.184 mm.\nStep 2: N = D² / (4λ) = 6² / (4 × 1.184) = 36 / 4.736 = 7.6 mm.\n\nSo a bigger crystal or a higher frequency gives a longer near field.\n\nCommon trap: A (30.4 mm) is D²/λ, where the 4 was forgotten. That gives exactly 4 times too much. C (1.27 mm) comes from forgetting to square D (6 / 4.736). D (1.90 mm) divides by 4 twice.\n\nCheck: the answer must be a few times D, here about 1.3 × D. If you get 30 mm for a 6 mm probe, something is off.","s":{"title":"Near field N = 7.6 mm","xlim":[-10,10],"ylim":[-20,5],"equal":false,"items":[{"type":"rect","xy":[-10,-20],"w":20,"h":20,"color":"steel","label":""},{"type":"rect","xy":[-3,0],"w":6,"h":3,"color":"wedge","label":"6 mm, 5 MHz"},{"type":"line","x":[-3,0,5],"y":[0,-7.6,-19],"color":"green","dashed":false,"width":2},{"type":"line","x":[3,0,-5],"y":[0,-7.6,-19],"color":"green","dashed":false,"width":2},{"type":"line","x":[-9,9],"y":[-7.6,-7.6],"color":"red","dashed":true,"width":1},{"type":"text","xy":[5,-6.6],"text":"N = 7.6 mm","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[-9.5,-3.5],"text":"Near field","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-9.5,-15],"text":"Far field","color":"ink","size":9,"anchor":"start"},{"type":"arrow","from":[-8,-0.5],"to":[-8,-7.4],"color":"blue"}]}}},{"t":"Near field & beam spread","l":"II","k":"calc","q":"A 12.7 mm diameter, 2.25 MHz straight-beam probe is used on aluminum (v = 6.32 mm/µs). How long is the near field?","o":[["57.4 mm",0,"You left out the 4. N = D² / (4λ)  (or N = D² f / 4v)."],["1.13 mm",0,"You did not square the diameter. N = D² / (4λ)."],["14.4 mm",1,""],["3.59 mm",0,"You put the radius into the diameter formula. With the radius it is N = r² / λ."]],"s":"λ = v / f = 6.32 / 2.25 = 2.809 mm\nN = D² / (4λ) = 12.7² / (4 × 2.809) = 14.4 mm.","h":"N = D² / (4λ) with λ = v / f.","d":null,"x":{"e":"Think of a flashlight. Close to the probe, the sound is messy and uneven. This is the near field. After it, the beam is smooth but spreads out.\n\nStep 1: wavelength = speed ÷ frequency = 6.32 ÷ 2.25 = 2.809 mm.\nStep 2: N = D² ÷ (4 × λ) = 12.7² ÷ (4 × 2.809) = 161.29 ÷ 11.236 = 14.4 mm.\n\nA bigger crystal or a higher frequency gives a longer near field.\n\nCommon traps:\n• D (3.59 mm): you used the radius (6.35 mm) in the D² ÷ 4λ formula. The formula already contains the \"4\", so use the full diameter.\n• A (57.4 mm): you forgot the 4 and calculated D² ÷ λ. This is 4 times too long.\n\nQuick check: the answer must be several wavelengths long, and 14.4 mm is about 5λ. That makes sense.","s":{"title":"Near field N = D² / 4λ","xlim":[-20,20],"ylim":[-30,8],"equal":true,"items":[{"type":"rect","xy":[-20,-30],"w":40,"h":30,"color":"steel"},{"type":"rect","xy":[-6.35,0],"w":12.7,"h":4,"color":"wedge","label":"Probe 12.7 mm"},{"type":"line","x":[-6.35,-6.35,-13],"y":[0,-14.4,-30],"color":"blue","dashed":false,"width":2},{"type":"line","x":[6.35,6.35,13],"y":[0,-14.4,-30],"color":"blue","dashed":false,"width":2},{"type":"line","x":[-16,16],"y":[-14.4,-14.4],"color":"red","dashed":true,"width":1},{"type":"arrow","from":[10,0],"to":[10,-14.4],"color":"red"},{"type":"text","xy":[11,-7],"text":"N = 14.4 mm","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[0,-7],"text":"Near field","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[0,-22],"text":"Far field","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Near field & beam spread","l":"II","k":"calc","q":"A 19 mm diameter, 10 MHz straight-beam probe is used on aluminum (v = 6.32 mm/µs). How long is the near field?","o":[["571 mm",0,"You left out the 4. N = D² / (4λ)  (or N = D² f / 4v)."],["7.52 mm",0,"You did not square the diameter. N = D² / (4λ)."],["35.7 mm",0,"You put the radius into the diameter formula. ield & beam spread","l":"II","k":"calc","q":"A 25 mm diameter, 10 MHz straight-beam probe is used on water (v = 1.48 mm/µs). How long is the near field?","o":[["1056 mm",1,""],["264 mm",0,"You put the radius into the diameter formula. With the radius it is N = r² / λ."],["4223 mm",0,"You left out the 4. N = D² / (4λ)  (or N = D² f / 4v)."],["42.2 mm",0,"You did not square the diameter. N = D² / (4λ)."]],"s":"λ = v / f = 1.48 / 10 = 0.148 mm\nN = D² / (4λ) = 25² / (4 × 0.148) = 1055.7 mm.","h":"N = D² / (4λ) with λ = v / f.","d":null,"x":{"e":"Think of a flashlight: close up, the light is messy. Further away it settles into a smooth cone. The near field is that messy zone right in front of the probe, and its length is N.\n\nStep 1: Wavelength λ = v / f = 1.48 / 10 = 0.148 mm.\nStep 2: N = D² / (4λ) = 25² / (4 × 0.148) = 625 / 0.592 ≈ 1056 mm (A).\n\nA high frequency gives a tiny λ, and a big crystal gives a big D². Both make N long.\n\nTraps:\n• C (4223 mm) is the most common slip. You forgot the 4 and used D² / λ.\n• B (264 mm) puts the radius (12.5 mm) in place of the diameter.\n• D (42.2 mm) is a decimal-place slip.\n\nTip: the formula needs the full diameter, and the 4 stays in the denominator.","s":{"title":"Near field length N","xlim":[-100,1400],"ylim":[-40,40],"equal":false,"items":[{"type":"rect","xy":[0,-30],"w":1300,"h":60,"color":"water","label":"Water"},{"type":"rect","xy":[-80,-12.5],"w":80,"h":25,"color":"wedge","label":"Probe"},{"type":"line","x":[0,1056,1300],"y":[12.5,0,10],"color":"blue","dashed":false,"width":2},{"type":"line","x":[0,1056,1300],"y":[-12.5,0,-10],"color":"blue","dashed":false,"width":2},{"type":"line","x":[1056,1056],"y":[-28,28],"color":"red","dashed":true,"width":1},{"type":"arrow","from":[0,-22],"to":[1056,-22],"color":"amber"},{"type":"text","xy":[528,-17],"text":"N = D²/(4λ) = 1056 mm","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[500,22],"text":"Near field: uneven","color":"ink","size":9,"anchor":"middle"},{" 56 = 31.9 mm.\n\nBigger probe or higher frequency means a longer near field.\n\nTraps:\n• D (128 mm) is D²/λ, which forgets the 4. This is the most common slip.\n• C (7.98 mm) uses the radius (6.35 mm) in the D² / 4λ formula. Use radius only with N = r²/λ.\n• A (2.51 mm) forgets to square D.","s":{"title":"Near field N = D² / 4λ","xlim":[-20,20],"ylim":[-52,10],"equal":false,"items":[{"type":"rect","xy":[-20,-52],"w":40,"h":52,"color":"steel","label":""},{"type":"rect","xy":[-6.35,0],"w":12.7,"h":6,"color":"wedge","label":"12.7 mm probe"},{"type":"line","x":[-6.35,-2],"y":[0,-31.9],"color":"blue","dashed":false,"width":2},{"type":"line","x":[6.35,2],"y":[0,-31.9],"color":"blue","dashed":false,"width":2},{"type":"line","x":[-2,-12],"y":[-31.9,-50],"color":"amber","dashed":false,"width":2},{"type":"line","x":[2,12],"y":[-31.9,-50],"color":"amber","dashed":false,"width":2},{"type":"line","x":[-16,16],"y":[-31.9,-31.9],"color":"red","dashed":true,"width":1},{"type":"text","xy":[-19,-35],"text":"N = 31.9 mm","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[9,-15],"text":"Near field","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[10,-44],"text":"Far field","color":"amber","size":9,"anchor":"start"}]}}},{"t":"Near field & beam spread","l":"II","k":"calc","q":"A 25 mm diameter, 2.25 MHz straight-beam probe is used on water (v = 1.48 mm/µs). How long is the near field?","o":[["238 mm",1,""],["59.4 mm",0,"You put the radius into the diameter formula. With the radius it is N = r² / λ."],["950 mm",0,"You left out the 4. N = D² / (4λ)  (or N = D² f / 4v)."],["9.50 mm",0,"You did not square the diameter. N = D² / (4λ)."]],"s":"λ = v / f = 1.48 / 2.25 = 0.658 mm\nN = D² / (4λ) = 25² / (4 × 0.658) = 237.5 mm.","h":"N = D² / (4λ) with λ = v / f.","d":null,"x":{"e":"Think of the near field as the 'messy zone' right in front of the probe. Past it, the beam settles down and spreads out like a flashlight.\n\nStep 1: Wavelength is the wave's 'step size'. λ =  5.92 mm/µs)?","o":[["6.6 °",0,"You used the radius instead of the diameter."],["3.3 °",1,""],["1.4 °",0,"0.51 λ/D gives the -6 dB edge, not the null (1.22 λ/D)."],["2.7 °",0,"You left out the 1.22 factor (first null: sin γ = 1.22 λ / D)."]],"s":"λ = 5.92 / 5 = 1.184 mm\nsin γ = 1.22 × 1.184 / 25 = 0.0578  →  γ = 3.3°.\nHigher frequency or a bigger probe = narrower beam.","h":"sin γ = 1.22 λ / D (diameter, not radius).","d":null,"x":{"e":"Think of a flashlight. A small lens makes a wide, messy beam. A big lens makes a tight beam. Sound does the same: a small probe or low frequency spreads more.\n\nStep 1 – wavelength: λ = v / f = 5.92 / 5 = 1.184 mm.\nStep 2 – sin γ = 1.22 × λ / D = 1.22 × 1.184 / 25 = 0.0578.\nStep 3 – γ = sin⁻¹(0.0578) ≈ 3.3°. That is B.\n\nγ is the half-angle: from the centre line to the edge of the beam.\n\nCommon traps:\n• 6.6° is the full spread (2 × 3.3°). The question asks for the half-angle.\n• 2.7° comes from forgetting the 1.22. Then you get λ/D = 0.0474, which gives 2.7°.\n\nRule: higher frequency or bigger probe means smaller λ/D, so a narrower beam.","s":{"title":"Beam spread half-angle (exaggerated)","xlim":[-60,60],"ylim":[-100,20],"equal":false,"items":[{"type":"rect","xy":[-60,-100],"w":120,"h":100,"color":"steel","label":"Steel"},{"type":"rect","xy":[-12,0],"w":25,"h":10,"color":"wedge","label":"25 mm probe"},{"type":"line","x":[0,0],"y":[0,-95],"color":"gray","dashed":true,"width":1},{"type":"line","x":[0,-40],"y":[0,-95],"color":"blue","dashed":false,"width":2},{"type":"line","x":[0,40],"y":[0,-95],"color":"blue","dashed":false,"width":2},{"type":"text","xy":[3,-40],"text":"γ = 3.3° half","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[0,-98],"text":"Full spread = 2γ = 6.6°","color":"amber","size":9,"anchor":"middle"},{"type":"text","xy":[-58,12],"text":"Not to scale","color":"ink","size":8,"anchor":"start"}]}}},{"t":"Near field & beam spread","l":"II","k":"calc","q":"What is the beam-spread half-angle (to the firs ":[-1.6,4.5],"text":"θ₁ 38.1°","color":"blue","anchor":"end"},{"type":"text","xy":[1.6,-4.5],"text":"θ₂ 45.0°","color":"red","anchor":"start"}]},"x":{"e":"Think of a car driving from pavement onto sand at an angle. The wheel that hits the slower ground first slows down, so the car turns. Sound bends the same way at the wedge/aluminum boundary.\n\nSnell's law: sin θ₁ / v₁ = sin θ₂ / v₂\n\nThe shear wave in aluminum is the faster one, so it bends away from the normal.\nsin θ₂ = (3.13 / 2.73) × sin 38.1° = 1.1465 × 0.617 = 0.7074\nθ₂ = 45.0° (B).\n\nMost common trap: flipping the ratio. Using 2.73/3.13 gives sin θ₂ = 0.538, so 32.6° (D). A quick check avoids it: the new speed is higher, so the angle must get bigger than 38.1°, not smaller.\n\nAlso, don't use v_L = 6.32 here. That gives sin θ₂ > 1, so no longitudinal wave exists. Only shear is left, which is why the question asks for it.","s":{"title":"Wedge to aluminum: 38.1° becomes 45.0°","xlim":[-5,5],"ylim":[-4.2,4.2],"equal":true,"items":[{"type":"rect","xy":[-5,0],"w":10,"h":4,"color":"wedge"},{"type":"rect","xy":[-5,-4],"w":10,"h":4,"color":"steel"},{"type":"line","x":[0,0],"y":[-3.8,3.8],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-2.47,3.16],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[2.83,-2.83],"color":"red"},{"type":"text","xy":[-4.8,3.6],"text":"Acrylic 2.73 mm/µs","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-4.8,-3.6],"text":"Aluminum Vs 3.13","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[0.2,1.5],"text":"38.1°","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[-0.2,-1.8],"text":"45.0°","color":"red","size":9,"anchor":"end"}]}}},{"t":"Refraction & critical angles","l":"II","k":"calc","q":"What is the first critical angle going from water (v = 1.48 mm/µs) into aluminum (v_L = 6.32, v_S = 3.13 mm/µs)?","o":[["76.5 °",0,"You gave the complement. The critical angle is measured from the normal."],["13.5 °",1,""],["13.2 °",0,"You used tan instead of sin. At the critical angle sin θ₁ = v₁ / v₂ (sin 90° = 1)."],["28.2 °",0,"That is the second critical angle. 1st uses v_L (L wave reaches 90°), 2nd uses v_S."]],"s":"At a critical angle the refracted wave runs along the surface (θ₂ = 90°, sin = 1):\nsin θ_c = v₁ / v₂\n1st (L): asin(1.48/6.32) = 13.5°\n2nd (S): asin(1.48/3.13) = 28.2°\nBetween them only a shear wave enters the part - the working range of angle-beam probes.","h":"sin θ_c = v₁ / v₂. First critical uses the longitudinal velocity, second uses the shear velocity.","d":null,"x":{"e":"Think of a car driving from pavement onto sand at an angle. The wheel that hits the faster surface first speeds up, so the car turns. Sound bends the same way at the water/aluminum boundary.\nAluminum is faster for longitudinal (L) waves (6.32 vs 1.48 mm/µs), so the beam bends away from the normal. Make the water angle bigger and the L wave bends more, until it skims along the surface at 90°. That water angle is the first critical angle.\nRule (Snell's law with sin 90° = 1):\nsin θc = v₁ / v₂ = 1.48 / 6.32 = 0.234\nθc = 13.5° (B)\nTraps:\n• 76.5° (A) is 90° − 13.5°. You measured from the surface instead of from the normal.\n• 28.2° (D) is the second critical angle. It uses the shear speed 3.13 mm/µs, not the L speed.\n• 13.2° (C) is just an arithmetic slip, so use your calculator carefully.\nBetween 13.5° and 28.2° only shear waves enter the aluminum. That is the working range for angle-beam probes.","s":{"title":"First critical angle: water to aluminum","xlim":[-6,6],"ylim":[-5,7],"equal":false,"items":[{"type":"rect","xy":[-6,0],"w":12,"h":6,"color":"water"},{"type":"rect","xy":[-6,-5],"w":12,"h":5,"color":"steel"},{"type":"line","x":[0,0],"y":[0,6],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-1.44,6],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,-0.6],"to":[5,-0.6],"color":"green"},{"type":"text","xy":[0.2,3.5],"text":"θc = 13.5°","color":"ink","size":9,"anchor":"start"},{"t ters a pool. Sound bends too, and it bends more when the new material is faster.\nTitanium has two speeds: a fast longitudinal wave (6.1 mm/µs) and a slower shear wave (3.12 mm/µs).\nTilt the beam more and more. First the fast L wave is pushed to skim along the surface. That is the 1st critical angle. Tilt further and the slower S wave skims along the surface. That is the 2nd critical angle.\nThe question asks for the 2nd, so use the shear speed.\nRule: sin θc = v₁ / v₂ (refracted angle = 90°).\nsin θ = 1.48 / 3.12 = 0.474, so θ = 28.3° (A).\n\nTrap: B (14.0°) comes from using the L speed (1.48/6.1). That is the 1st critical angle. D (61.7°) is 90° − 28.3°, an angle measured from the surface instead of from the normal.\n\nBetween 14.0° and 28.3° only a shear wave enters the part. This is the working range for angle-beam probes.","s":{"title":"2nd critical angle: shear wave skims the surface","xlim":[-10,10],"ylim":[-6,8],"equal":true,"items":[{"type":"rect","xy":[-10,0],"w":20,"h":8,"color":"water","label":""},{"type":"rect","xy":[-10,-6],"w":20,"h":6,"color":"steel","label":""},{"type":"line","x":[0,0],"y":[-5,7],"color":"gray","dashed":true,"width":1},{"type":"line","x":[-3.77,0],"y":[7,0],"color":"blue","dashed":false,"width":2},{"type":"arrow","from":[0,0],"to":[8,0],"color":"red"},{"type":"text","xy":[0.4,3.5],"text":"28.3°","color":"ink","size":10,"anchor":"start"},{"type":"text","xy":[4.5,1],"text":"Shear at 90°","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[6,5.5],"text":"Water 1.48","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[0,-3],"text":"Titanium S = 3.12","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Refraction & critical angles","l":"II","k":"calc","q":"What is the first critical angle going from acrylic wedge (v = 2.73 mm/µs) into steel (v_L = 5.92, v_S = 3.23 mm/µs)?","o":[["27.5 °",1,""],["57.7 °",0,"That is the second critical angle. 1st uses v_L (L wave reaches 90°), 2nd uses v_S."],["62.5 °",0,"You gave th
