er, so the beam bends away from the normal (the line straight down).\nAs you tilt the beam more, the bent wave leans further and further over. At one angle it runs exactly along the surface (90°). That is a critical angle.\nAluminum has two waves:\n• Longitudinal (6.32 mm/µs) reaches 90° first: asin(1.48/6.32) = 13.5° (1st critical).\n• Shear (3.13 mm/µs) is slower, so it needs a bigger angle: asin(1.48/3.13) = 28.2° (2nd critical).\nFormula: sin θc = v₁ / v₂\nSo the answer is D, 28.2°. Between 13.5° and 28.2° only shear enters the part, which is the angle-beam working range.\nTraps:\n• C (13.5°) uses the longitudinal speed, which gives the 1st critical angle.\n• A (61.8°) is 90° − 28.2°. It measures from the surface instead of from the normal.\nTip: 'second' means shear, the slower wave, so use the smaller velocity.","s":{"title":"2nd critical angle: water to aluminum","xlim":[-6,6],"ylim":[-4,5],"equal":true,"items":[{"type":"rect","xy":[-6,0],"w":12,"h":5,"color":"water","label":"Water 1.48"},{"type":"rect","xy":[-6,-4],"w":12,"h":4,"color":"steel","label":"Aluminum"},{"type":"line","x":[0,0],"y":[0,4.6],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-2.4,4.5],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[5,0],"color":"red"},{"type":"text","xy":[-0.3,2.2],"text":"28.2°","color":"ink","size":9,"anchor":"end"},{"type":"text","xy":[-2.6,4.7],"text":"Incident beam","color":"blue","size":9,"anchor":"middle"},{"type":"text","xy":[2.8,0.5],"text":"Shear at 90°","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[0.2,4.6],"text":"Normal","color":"gray","size":9,"anchor":"start"}]}}},{"t":"Refraction & critical angles","l":"II","k":"calc","q":"What is the first critical angle going from acrylic wedge (v = 2.73 mm/µs) into aluminum (v_L = 6.32, v_S = 3.13 mm/µs)?","o":[["25.6 °",1,""],["60.7 °",0,"That is the second critical angle. 1st uses v_L (L wave reaches 90°), 2nd uses v_S."],["64.4 °",0,"You gave the complement. The critical angle is measured from the normal."],["23.4 °",0,"You used tan instead of sin. At the critical angle sin θ₁ = v₁ / v₂ (sin 90° = 1)."]],"s":"At a critical angle the refracted wave runs along the surface (θ₂ = 90°, sin = 1):\nsin θ_c = v₁ / v₂\n1st (L): asin(2.73/6.32) = 25.6°\n2nd (S): asin(2.73/3.13) = 60.7°\nBetween them only a shear wave enters the part - the working range of angle-beam probes.","h":"sin θ_c = v₁ / v₂. First critical uses the longitudinal velocity, second uses the shear velocity.","d":null,"x":{"e":"Think of a car driving from pavement onto a faster road at a slant. The wave bends toward the faster side. The faster the second material, the more it bends.\n\nAs you tilt the beam in the wedge, the longitudinal (L) wave in aluminum bends more and more away from the normal. At one special angle it bends all the way to 90° and slides along the surface. That is the first critical angle.\n\nFormula (Snell's law with θ₂ = 90°, sin 90° = 1):\nsin θc = v₁ / v₂ = 2.73 / 6.32 = 0.432\nθc = 25.6° (answer A)\n\nCommon trap: B (60.7°) comes from using the shear speed 3.13, which gives the SECOND critical angle. C (64.4°) is just 90° − 25.6°, an angle measured from the surface instead of the normal. Always measure from the normal and use the L velocity for the first critical angle.\n\nBetween 25.6° and 60.7° only shear waves enter the aluminum. That is the working range for angle-beam probes.","s":{"title":"First critical angle: L wave at 90°","xlim":[-5,5],"ylim":[-4.5,4.5],"equal":true,"items":[{"type":"rect","xy":[-5,0],"w":10,"h":4,"color":"wedge"},{"type":"rect","xy":[-5,-4],"w":10,"h":4,"color":"steel"},{"type":"line","x":[0,0],"y":[-3,4],"color":"gray","dashed":true,"width":1},{"type":"line","x":[-1.92,0],"y":[4,0],"color":"red","dashed":false,"width":2},{"type":"line","x":[0,1.92],"y":[0,4],"color":"blue","dashed":true,"width":1},{"type":"arrow","from":[0,-0.3],"to":[4.5,-0.3],"color":"green"},{"type":"text","xy":[-4.8,3.3],"text":"Acrylic 2.73","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-4.8,-2.5],"text":"Aluminum L 6.32","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-1,1.8],"text":"25.6°","color":"red","size":9,"anchor":"end"},{"type":"text","xy":[4.8,-1.1],"text":"L wave at 90°","color":"green","size":9,"anchor":"end"}]}}},{"t":"Refraction & critical angles","l":"II","k":"calc","q":"What is the second critical angle going from acrylic wedge (v = 2.73 mm/µs) into aluminum (v_L = 6.32, v_S = 3.13 mm/µs)?","o":[["29.3 °",0,"You gave the complement. The critical angle is measured from the normal."],["41.1 °",0,"You used tan instead of sin. At the critical angle sin θ₁ = v₁ / v₂ (sin 90° = 1)."],["60.7 °",1,""],["25.6 °",0,"That is the first critical angle. 1st uses v_L (L wave reaches 90°), 2nd uses v_S."]],"s":"At a critical angle the refracted wave runs along the surface (θ₂ = 90°, sin = 1):\nsin θ_c = v₁ / v₂\n1st (L): asin(2.73/6.32) = 25.6°\n2nd (S): asin(2.73/3.13) = 60.7°\nBetween them only a shear wave enters the part - the working range of angle-beam probes.","h":"sin θ_c = v₁ / v₂. First critical uses the longitudinal velocity, second uses the shear velocity.","d":null,"x":{"e":"Think of light bending as it leaves water. The faster the second material, the more the beam bends away from the normal. At the critical angle the bent beam just skims along the surface, at 90°.\nSnell's law gives: sin θc = v₁ / v₂, with v₁ = 2.73 mm/µs (acrylic).\n\nSecond critical angle uses the shear speed of aluminum, 3.13 mm/µs:\nsin θ = 2.73 / 3.13 = 0.872, so θ = 60.7° (answer C).\n\nTrap: D (25.6°) is the FIRST critical angle. It uses v_L = 6.32 mm/µs, and it is the point where the longitudinal wave starts skimming. Between 25.6° and 60.7°, only shear waves enter the aluminum. That is the useful window for angle-beam probes.\nAt 60.7° and beyond, the shear wave is gone too, leaving only surface waves.","s":{"title":"Second critical angle: shear wave skims the surface","xlim":[-6,6],"ylim":[-4,4.5],"equal":true,"items":[{"type":"rect","xy":[-6,0],"w":12,"h":4,"color":"wedge"},{"type":"rect","xy":[-6,-4],"w":12,"h":4,"color":"steel"},{"type":"text","xy":[-5.8,3.5],"text":"Acrylic 2.73","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-5.8,-3.4],"text":"Aluminum","color":"ink","size":9,"anchor":"start"},{"type":"line","x":[0,0],"y":[-3,4],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-4.36,2.45],"to":[0,0],"color":"blue"},{"type":"text","xy":[0.2,1.3],"text":"θ = 60.7°","color":"blue","size":9,"anchor":"start"},{"type":"arrow","from":[0,0],"to":[5,0],"color":"red"},{"type":"text","xy":[2.5,-0.7],"text":"Shear at 90°","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[-3,-1.8],"text":"No L wave","color":"gray","size":9,"anchor":"middle"}]}}},{"t":"Refraction & critical angles","l":"III","k":"calc","q":"What incident (wedge) angle in acrylic (v = 2.73 mm/µs) produces a 60° shear wave in steel (v_S = 3.23 mm/µs)?","o":[["23.5 °",0,"You used the longitudinal velocity of steel; the target is a shear wave."],["47.1 °",1,""],["36.3 °",0,"Velocity ratio flipped. sin θ₁ = (v_wedge / v_S) sin θ₂."],["50.7 °",0,"You scaled the angle, not its sine. Use sin θ₁ = (v₁ / v₂) sin θ₂."]],"s":"sin θ₁ = (v_wedge / v_S) sin θ₂ = (2.73 / 3.23) × sin 60° = 0.7320  →  θ₁ = 47.1°","h":"Run Snell's law backwards: sin θ₁ = (v₁ / v₂) sin θ₂.","d":{"xlim":[-11,11],"ylim":[-10,10],"items":[{"type":"rect","xy":[-11,0],"w":22,"h":10,"color":"wedge","label":"wedge 2.73 mm/µs"},{"type":"rect","xy":[-11,-10],"w":22,"h":10,"color":"steel","label":"part v_S 3.23 mm/µs"},{"type":"line","x":[0,0],"y":[-9.5,9.5],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-7.32,6.81],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[8.66,-5.0],"color":"red"},{"type":"text","xy":[-1.6,4.5],"text":"θ₁ 47.1°","color":"blue","anchor":"end"},{"type":"text","xy":[1.6,-4.5],"text":"θ₂ 60.0°","color":"red","anchor":"start"}]},"x":{"e":"Think of a car driving from pavement onto faster ground: the beam bends. Snell's law tells us how much.\nThe shear wave in steel travels faster (3.23) than the sound in acrylic (2.73). So the wedge angle must be smaller than 60°.\nStep 1: Ratio of speeds = 2.73 / 3.23 = 0.845.\nStep 2: sin 60° = 0.866.\nStep 3: sin θ₁ = 0.845 × 0.866 = 0.732.\nStep 4: θ₁ = arcsin(0.732) = 47.1°.\nRule: sin θ₁ / v₁ = sin θ₂ / v₂.\nCommon trap (option D, 50.7°): multiplying the angle by the speed ratio (0.845 × 60° = 50.7°). Snell's law works on the SINE of the angle, not the angle itself. Always take the sine, multiply, then use arcsin. Also don't flip the ratio: that gives a value above 1, which is impossible.","s":{"title":"Acrylic wedge to steel: 47.1° in, 60° shear out","xlim":[-5,5],"ylim":[-4,4],"equal":true,"items":[{"type":"rect","xy":[-5,0],"w":10,"h":4,"color":"wedge"},{"type":"rect","xy":[-5,-4],"w":10,"h":4,"color":"steel"},{"type":"line","x":[0,0],"y":[-3.5,3.5],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-2.93,2.72],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[3.46,-2.0],"color":"red"},{"type":"text","xy":[-4.8,3.4],"text":"Acrylic 2.73 mm/µs","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-4.8,-3.5],"text":"Steel 3.23 mm/µs","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[-1.0,1.0],"text":"47.1°","color":"blue","size":10,"anchor":"middle"},{"type":"text","xy":[0.3,-2.3],"text":"60°","color":"red","size":10,"anchor":"start"}]}}},{"t":"Refraction & critical angles","l":"III","k":"calc","q":"What incident (wedge) angle in acrylic (v = 2.73 mm/µs) produces a 45° shear wave in steel (v_S = 3.23 mm/µs)?","o":[["26.9 °",0,"Velocity ratio flipped. sin θ₁ = (v_wedge / v_S) sin θ₂."],["38.0 °",0,"You scaled the angle, not its sine. Use sin θ₁ = (v₁ / v₂) sin θ₂."],["19.0 °",0,"You used the longitudinal velocity of steel; the target is a shear wave."],["36.7 °",1,""]],"s":"sin θ₁ = (v_wedge / v_S) sin θ₂ = (2.73 / 3.23) × sin 45° = 0.5976  →  θ₁ = 36.7°","h":"Run Snell's law backwards: sin θ₁ = (v₁ / v₂) sin θ₂.","d":{"xlim":[-11,11],"ylim":[-10,10],"items":[{"type":"rect","xy":[-11,0],"w":22,"h":10,"color":"wedge","label":"wedge 2.73 mm/µs"},{"type":"rect","xy":[-11,-10],"w":22,"h":10,"color":"steel","label":"part v_S 3.23 mm/µs"},{"type":"line","x":[0,0],"y":[-9.5,9.5],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-5.98,8.02],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[7.07,-7.07],"color":"red"},{"type":"text","xy":[-1.6,4.5],"text":"θ₁ 36.7°","color":"blue","anchor":"end"},{"type":"text","xy":[1.6,-4.5],"text":"θ₂ 45.0°","color":"red","anchor":"start"}]},"x":{"e":"Think of the beam like a car driving from pavement onto sand. It bends when the speed changes. Snell's law tells us how much: the ratio sin θ / v stays the same on both sides.\n\nSteel is faster (3.23) than acrylic (2.73), so the beam bends away from the normal. The wedge angle must therefore be smaller than 45°.\n\nFormula: sin θ₁ = (v_wedge / v_S) × sin θ₂\nsin θ₁ = (2.73 / 3.23) × sin 45° = 0.8452 × 0.7071 = 0.5976\nθ₁ = arcsin(0.5976) = 36.7° (D).\n\nCommon trap: scaling the angle instead of the sine.\n• 45° × 0.8452 = 38.0° (B)\n• 45° × 0.5976 = 26.9° (A)\nAngles do not scale in proportion. Only the sines do. Always take sin, multiply, then use arcsin.","s":{"title":"Wedge angle for a 45° shear wave","xlim":[-5,5],"ylim":[-5,5],"equal":true,"items":[{"type":"rect","xy":[-5,0],"w":10,"h":5,"color":"wedge"},{"type":"rect","xy":[-5,-5],"w":10,"h":5,"color":"steel"},{"type":"line","x":[0,0],"y":[-4.5,4.5],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-2.98,4],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[3.5,-3.5],"color":"red"},{"type":"text","xy":[0.2,2.8],"text":"θ₁ = 36.7°","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[0.3,-1.6],"text":"45°","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[-4.8,4.5],"text":"Acrylic 2.73 mm/µs","color":"ink","size":8,"anchor":"start"},{"type":"text","xy":[-4.8,-4.5],"text":"Steel 3.23 mm/µs","color":"ink","size":8,"anchor":"start"}]}}},{"t":"Refraction & critical angles","l":"III","k":"calc","q":"What incident (wedge) angle in acrylic (v = 2.73 mm/µs) produces a 70° shear wave in steel (v_S = 3.23 mm/µs)?","o":[["52.6 °",1,""],["59.2 °",0,"You scaled the angle, not its sine. Use sin θ₁ = (v₁ / v₂) sin θ₂."],["25.7 °",0,"You used the longitudinal velocity of steel; the target is a shear wave."],["42.7 °",0,"Velocity ratio flipped. sin θ₁ = (v_wedge / v_S) sin θ₂."]],"s":"sin θ₁ = (v_wedge / v_S) sin θ₂ = (2.73 / 3.23) × sin 70° = 0.7942  →  θ₁ = 52.6°","h":"Run Snell's law backwards: sin θ₁ = (v₁ / v₂) sin θ₂.","d":{"xlim":[-11,11],"ylim":[-10,10],"items":[{"type":"rect","xy":[-11,0],"w":22,"h":10,"color":"wedge","label":"wedge 2.73 mm/µs"},{"type":"rect","xy":[-11,-10],"w":22,"h":10,"color":"steel","label":"part v_S 3.23 mm/µs"},{"type":"line","x":[0,0],"y":[-9.5,9.5],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[-7.94,6.08],"to":[0,0],"color":"blue"},{"type":"arrow","from":[0,0],"to":[9.4,-3.42],"color":"red"},{"type":"text","xy":[-1.6,4.5],"text":"θ₁ 52.6°","color":"blue","anchor":"end"},{"type":"text","xy":[1.6,-4.5],"text":"θ₂ 70.0°","color":"red","anchor":"start"}]},"x":{"e":"Think of a car driving from pavement onto mud at an angle. The wheel that hits the mud first slows down, so the car turns. Sound bends the same way at a boundary.\n\nSteel shear waves are faster (3.23 mm/µs) than the wave in acrylic (2.73 mm/µs). A wave going into a faster material bends away from the normal. So the wedge angle must be smaller than 70°.\n\nRule (Snell's law): sin θ₁ / v₁ = sin θ₂ / v₂\n\nsin θ₁ = (2.73 / 3.23) × sin 70°\nsin θ₁ = 0.8452 × 0.9397 = 0.7942\nθ₁ = 52.6° (A)\n\nCommon trap: option B (59.2°). It comes from multiplying the angle by the speed ratio: 70° × 0.8452 = 59.2°. Angles do not scale like that. The sines do, so always take sin first, then arcsin.\n\nQuick check: the answer must be below 70°, and it is.","s":{"title":"Snell's law: wedge to steel","xlim":[-5,5],"ylim":[-3,3.5],"equal":true,"items":[{"type":"rect","xy":[-5,0],"w":10,"h":3.5,"color":"wedge","label":"Acrylic 2.73 mm/µs"},{"type":"rect","xy":[-5,-3],"w":10,"h":3,"color":"steel","label":"Steel 3.23 mm/µs"},{"type":"line","x":[0,0],"y":[-3,3.5],"color":"gray","dashed":true,"width":1},{"type":"line","x":[-3.18,0],"y":[2.43,0],"color":"blue","width":2},{"type":"arrow","from":[-3.18,2.43],"to":[-2.2,1.68],"color":"blue"},{"type":"line","x":[0,2.82],"y":[0,-1.03],"color":"red","width":2},{"type":"arrow","from":[1.9,-0.69],"to":[2.82,-1.03],"color":"red"},{"type":"text","xy":[-1.5,3.0],"text":"52.6° incident","color":"blue","size":9,"anchor":"middle"},{"type":"text","xy":[2.3,-0.3],"text":"70° shear","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[0.15,3.2],"text":"normal","color":"gray","size":8,"anchor":"start"}]}}},{"t":"Impedance & reflection","l":"II","k":"calc","q":"Sound at normal incidence goes from water (Z = 1.48 MRayl) into aluminum (Z = 17.1 MRayl). What percentage of the ENERGY is reflected?","o":[["8.7 %",0,"Impedances are not divided directly. Use R = (Z₂ − Z₁) / (Z₂ + Z₁)."],["70.6 %",1,""],["16.0 %",0,"That is the transmitted part, not the reflected part."],["84.0 %",0,"That is the amplitude value. Amplitude R = (Z₂−Z₁)/(Z₂+Z₁); energy = R²."]],"s":"Z = ρ·v.  R = (Z₂ − Z₁)/(Z₂ + Z₁) = (17.1 − 1.48) / (17.1 + 1.48) = 0.840\nAmplitude reflected = 84.0 %,  energy reflected = R² = 70.6 %.","h":"R = (Z₂ − Z₁)/(Z₂ + Z₁) for amplitude; square it for energy.","d":null,"x":{"e":"Think of a ball thrown at a wall. Water is soft for sound and aluminum is hard, so most of the sound bounces back.\n\nStep 1: Find the pressure (amplitude) reflection:\nR = (Z₂ − Z₁)/(Z₂ + Z₁) = (17.1 − 1.48)/(17.1 + 1.48) = 15.62/18.58 = 0.84\nSo 84 % of the sound PRESSURE comes back.\n\nStep 2: The question asks for ENERGY. Energy goes with pressure squared:\nR² = 0.84² = 0.706, which is 70.6 %.\n\nCheck: the other 29.4 % of the energy goes into the aluminum.\n\nMost common trap: answer D (84.0 %). That is the amplitude, and it is what you get if you forget to square. Option C (16.0 %) is just 100 − 84, which is also a mix-up.\n\nRule: amplitude uses R. Energy uses R². Always read whether the question says amplitude or energy.","s":{"title":"Water to aluminum, normal incidence","xlim":[0,10],"ylim":[-8,9],"equal":false,"items":[{"type":"rect","xy":[0,0],"w":10,"h":8,"color":"water","label":"Water Z=1.48"},{"type":"rect","xy":[0,-8],"w":10,"h":8,"color":"steel","label":"Aluminum Z=17.1"},{"type":"arrow","from":[3,7],"to":[3,0.2],"color":"blue"},{"type":"arrow","from":[7,0.2],"to":[7,7],"color":"red"},{"type":"text","xy":[3,8.2],"text":"Incident 100%","color":"blue","size":9,"anchor":"middle"},{"type":"text","xy":[7,8.2],"text":"Reflected","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[7.3,4],"text":"Amplitude 84%","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[7.3,2.8],"text":"Energy 70.6%","color":"red","size":9,"anchor":"start"},{"type":"arrow","from":[3,-0.5],"to":[3,-5],"color":"green"},{"type":"text","xy":[3.3,-6.5],"text":"Energy in: 29.4%","color":"green","size":9,"anchor":"middle"}]}}},{"t":"Impedance & reflection","l":"II","k":"calc","q":"Sound at normal incidence goes from water (Z = 1.48 MRayl) into steel (Z = 46.5 MRayl). What percentage of the AMPLITUDE is reflected?","o":[["6.2 %",0,"That is the transmitted part, not the reflected part."],["93.8 %",1,""],["88.0 %",0,"That is the energy value. Amplitude R = (Z₂−Z₁)/(Z₂+Z₁); energy = R²."],["3.2 %",0,"Impedances are not divided directly. Use R = (Z₂ − Z₁) / (Z₂ + Z₁)."]],"s":"Z = ρ·v.  R = (Z₂ − Z₁)/(Z₂ + Z₁) = (46.5 − 1.48) / (46.5 + 1.48) = 0.938\nAmplitude reflected = 93.8 %,  energy reflected = R² = 88.0 %.","h":"R = (Z₂ − Z₁)/(Z₂ + Z₁) for amplitude; square it for energy.","d":null,"x":{"e":"Think of a ball hitting a wall. Water is soft and steel is very hard for sound, like a ball bouncing off a brick wall. Most of the sound bounces back.\nThe size of the mismatch decides how much bounces. Z = density × velocity. Water is 1.48 MRayl and steel is 46.5 MRayl, so the mismatch is huge.\nFormula: R = (Z₂ − Z₁)/(Z₂ + Z₁) = (46.5 − 1.48)/(46.5 + 1.48) = 45.02/47.98 = 0.938.\nSo 93.8 % of the AMPLITUDE comes back (B).\nCommon trap: C, 88.0 %. That is R² = 0.880, which is the ENERGY reflected. The question asks for amplitude, so do not square.\nOther wrong options: A (6.2 %) is just 100 − 93.8, the part that did not reflect. D (3.2 %) is Z₁/Z₂, a wrong shortcut.\nTip: read whether the question says amplitude (pressure) or energy (intensity).","s":{"title":"Water to steel, normal incidence","xlim":[0,10],"ylim":[-5,5],"equal":false,"items":[{"type":"rect","xy":[0,0],"w":10,"h":5,"color":"water","label":"Water Z=1.48"},{"type":"rect","xy":[0,-5],"w":10,"h":5,"color":"steel","label":"Steel Z=46.5"},{"type":"arrow","from":[3.5,4.5],"to":[3.5,0.1],"color":"blue"},{"type":"text","xy":[3.3,3.2],"text":"Incident 100%","color":"blue","size":9,"anchor":"end"},{"type":"arrow","from":[6.5,0.1],"to":[6.5,4.5],"color":"green","width":4},{"type":"text","xy":[6.7,3.2],"text":"Reflected 93.8%","color":"green","size":9,"anchor":"start"},{"type":"arrow","from":[5,-0.1],"to":[5,-2],"color":"red"},{"type":"text","xy":[5.2,-2.6],"text":"Transmitted, weak","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[5,-4.3],"text":"Energy back = 0.938² = 88%","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Impedance & reflection","l":"II","k":"calc","q":"Sound at normal incidence goes from acrylic (Z = 3.22 MRayl) into steel (Z = 46.5 MRayl). What percentage of the ENERGY is reflected?","o":[["75.8 %",1,""],["6.9 %",0,"Impedances are not divided directly. Use R = (Z₂ − Z₁) / (Z₂ + Z₁)."],["87.0 %",0,"That is the amplitude value. Amplitude R = (Z₂−Z₁)/(Z₂+Z₁); energy = R²."],["13.0 %",0,"That is the transmitted part, not the reflected part."]],"s":"Z = ρ·v.  R = (Z₂ − Z₁)/(Z₂ + Z₁) = (46.5 − 3.22) / (46.5 + 3.22) = 0.870\nAmplitude reflected = 87.0 %,  energy reflected = R² = 75.8 %.","h":"R = (Z₂ − Z₁)/(Z₂ + Z₁) for amplitude; square it for energy.","d":null,"x":{"e":"Think of a ball hitting a wall. Acrylic is soft and steel is very hard. The big gap in stiffness makes most of the sound bounce back.\nStep 1: Reflection coefficient (pressure) R = (Z₂ − Z₁)/(Z₂ + Z₁) = (46.5 − 3.22)/(46.5 + 3.22) = 43.28/49.72 = 0.870. So 87.0 % of the sound PRESSURE is reflected.\nStep 2: Energy goes with the square: R² = 0.870² = 0.758, so 75.8 % of the ENERGY is reflected. The rest (24.2 %) goes into the steel.\nTraps:\n• C (87.0 %) is the amplitude. The question asks for energy, so you must square it.\n• D (13.0 %) is 1 − 0.870, the amplitude that is NOT reflected.\n• B (6.9 %) is just Z₁/Z₂, which is not a real formula for this.\nRule: energy reflected = R², and energy reflected + energy transmitted = 100 %.","s":{"title":"Acrylic to steel, normal incidence","xlim":[0,10],"ylim":[-3,3],"equal":false,"items":[{"type":"rect","xy":[0,-2],"w":5,"h":4,"color":"wedge","label":"Acrylic 3.22"},{"type":"rect","xy":[5,-2],"w":5,"h":4,"color":"steel","label":"Steel 46.5"},{"type":"arrow","from":[0.4,0.8],"to":[4.9,0.8],"color":"blue"},{"type":"text","xy":[2.5,1.2],"text":"Incident 100 %","color":"blue","size":9,"anchor":"middle"},{"type":"arrow","from":[4.9,-0.8],"to":[0.4,-0.8],"color":"red"},{"type":"text","xy":[2.5,-1.3],"text":"Reflected 75.8 % energy","color":"red","size":9,"anchor":"middle"},{"type":"arrow","from":[5.1,0],"to":[9.5,0],"color":"green"},{"type":"text","xy":[7.5,0.4],"text":"Transmitted 24.2 %","color":"green","size":9,"anchor":"middle"},{"type":"text","xy":[5,2.5],"text":"R = 0.870, R² = 0.758","color":"ink","size":10,"anchor":"middle"}]}}},{"t":"Impedance & reflection","l":"II","k":"calc","q":"Sound at normal incidence goes from acrylic (Z = 3.22 MRayl) into steel (Z = 46.5 MRayl). What percentage of the AMPLITUDE is reflected?","o":[["6.9 %",0,"Impedances are not divided directly. Use R = (Z₂ − Z₁) / (Z₂ + Z₁)."],["87.0 %",1,""],["13.0 %",0,"That is the transmitted part, not the reflected part."],["75.8 %",0,"That is the energy value. Amplitude R = (Z₂−Z₁)/(Z₂+Z₁); energy = R²."]],"s":"Z = ρ·v.  R = (Z₂ − Z₁)/(Z₂ + Z₁) = (46.5 − 3.22) / (46.5 + 3.22) = 0.870\nAmplitude reflected = 87.0 %,  energy reflected = R² = 75.8 %.","h":"R = (Z₂ − Z₁)/(Z₂ + Z₁) for amplitude; square it for energy.","d":null,"x":{"e":"Think of a tennis ball hitting a wall. The harder the wall compared with where the ball comes from, the more bounces back.\nAcrylic is soft for sound (Z = 3.22 MRayl). Steel is very hard (Z = 46.5 MRayl). The big mismatch at the boundary sends most of the sound back.\nFormula: R = (Z₂ − Z₁)/(Z₂ + Z₁)\nR = (46.5 − 3.22)/(46.5 + 3.22) = 43.28/49.72 = 0.870\nSo 87.0 % of the AMPLITUDE is reflected (B).\nTraps in the other options:\n• D (75.8 %) is R², which is the ENERGY reflected. The question asks for amplitude, so do not square it. This is the most common trap.\n• C (13.0 %) is 100 − 87. Amplitudes do not simply add up to 100 %, so this is not the transmitted amplitude.\n• A (6.9 %) is Z₁/Z₂, a plain ratio with no subtraction.\nNote that the energy that goes into the steel is 100 − 75.8 = 24.2 %.","s":{"title":"Acrylic to steel, normal incidence","xlim":[-7,7],"ylim":[-4,4.5],"equal":false,"items":[{"type":"rect","xy":[-6,-3],"w":6,"h":6,"color":"wedge"},{"type":"rect","xy":[0,-3],"w":6,"h":6,"color":"steel"},{"type":"text","xy":[-3,3.6],"text":"Acrylic Z=3.22","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[3,3.6],"text":"Steel Z=46.5","color":"ink","size":9,"anchor":"middle"},{"type":"arrow","from":[-6,1],"to":[-0.2,1],"color":"blue"},{"type":"text","xy":[-3,1.5],"text":"Incident 100%","color":"blue","size":9,"anchor":"middle"},{"type":"arrow","from":[-0.2,-1],"to":[-6,-1],"color":"red"},{"type":"text","xy":[-3,-1.7],"text":"Reflected 87%","color":"red","size":9,"anchor":"middle"},{"type":"arrow","from":[0.2,1],"to":[3,1],"color":"green"},{"type":"text","xy":[3,0.2],"text":"24% energy in","color":"green","size":9,"anchor":"middle"},{"type":"text","xy":[0,-3.6],"text":"Amplitude R = 0.87, energy R² = 0.758","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Impedance & reflection","l":"II","k":"calc","q":"Sound at normal incidence goes from water (Z = 1.48 MRayl) into steel (Z = 46.5 MRayl). What percentage of the ENERGY is reflected?","o":[["88.0 %",1,""],["3.2 %",0,"Impedances are not divided directly. Use R = (Z₂ − Z₁) / (Z₂ + Z₁)."],["93.8 %",0,"That is the amplitude value. Amplitude R = (Z₂−Z₁)/(Z₂+Z₁); energy = R²."],["6.2 %",0,"That is the transmitted part, not the reflected part."]],"s":"Z = ρ·v.  R = (Z₂ − Z₁)/(Z₂ + Z₁) = (46.5 − 1.48) / (46.5 + 1.48) = 0.938\nAmplitude reflected = 93.8 %,  energy reflected = R² = 88.0 %.","h":"R = (Z₂ − Z₁)/(Z₂ + Z₁) for amplitude; square it for energy.","d":null,"x":{"e":"Think of a tennis ball hitting a brick wall: steel is a very \"hard wall\" for sound in water. The big impedance mismatch (46.5 vs 1.48 MRayl) bounces most sound back.\n\nStep 1: Amplitude (pressure) reflection:\nR = (Z₂ − Z₁)/(Z₂ + Z₁) = (46.5 − 1.48)/(46.5 + 1.48) = 45.02/47.98 = 0.938, so 93.8 %.\n\nStep 2: Energy goes with amplitude SQUARED:\nR² = 0.938² = 0.880, so 88.0 % energy reflected. The other 12 % goes into the steel.\n\nTrap: C (93.8 %) is the amplitude answer. The question asks for ENERGY, so you must square it. Wrong options also come from other slips: B (3.2 %) is just Z₁/Z₂, and D (6.2 %) is 100 − 93.8.\n\nRule: energy reflected = R², energy transmitted = 1 − R² = 4Z₁Z₂/(Z₁+Z₂)².","s":{"title":"Water to steel, normal incidence","xlim":[0,10],"ylim":[-5,5],"equal":false,"items":[{"type":"rect","xy":[0,0],"w":10,"h":5,"color":"water"},{"type":"rect","xy":[0,-5],"w":10,"h":5,"color":"steel"},{"type":"arrow","from":[3,4.5],"to":[3,0.2],"color":"blue"},{"type":"arrow","from":[5.5,0.2],"to":[5.5,4.5],"color":"red"},{"type":"arrow","from":[3,-0.2],"to":[3,-1.8],"color":"green"},{"type":"text","xy":[2.8,2.5],"text":"Incident 100%","color":"blue","size":9,"anchor":"end"},{"type":"text","xy":[5.8,2.5],"text":"Reflected 88%","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[3.3,-1.2],"text":"Transmitted 12%","color":"green","size":9,"anchor":"start"},{"type":"text","xy":[9.8,4.4],"text":"Water Z=1.48","color":"ink","size":9,"anchor":"end"},{"type":"text","xy":[9.8,-4.4],"text":"Steel Z=46.5","color":"ink","size":9,"anchor":"end"}]}}},{"t":"Impedance & reflection","l":"II","k":"calc","q":"Sound at normal incidence goes from water (Z = 1.48 MRayl) into aluminum (Z = 17.1 MRayl). What percentage of the AMPLITUDE is reflected?","o":[["84.0 %",1,""],["8.7 %",0,"Impedances are not divided directly. Use R = (Z₂ − Z₁) / (Z₂ + Z₁)."],["16.0 %",0,"That is the transmitted part, not the reflected part."],["70.6 %",0,"That is the energy value. Amplitude R = (Z₂−Z₁)/(Z₂+Z₁); energy = R²."]],"s":"Z = ρ·v.  R = (Z₂ − Z₁)/(Z₂ + Z₁) = (17.1 − 1.48) / (17.1 + 1.48) = 0.840\nAmplitude reflected = 84.0 %,  energy reflected = R² = 70.6 %.","h":"R = (Z₂ − Z₁)/(Z₂ + Z₁) for amplitude; square it for energy.","d":null,"x":{"e":"Think of a ball thrown at a wall. A soft, light wall (water) lets it through easily. A hard, heavy wall (aluminum) bounces much of it back. The bigger the 'hardness gap' between the two materials, the stronger the echo.\nThe hardness of a material for sound is its acoustic impedance, Z = ρ·v.\nWater is 1.48 MRayl and aluminum is 17.1 MRayl, so the gap is big.\nFormula (amplitude): R = (Z₂ − Z₁)/(Z₂ + Z₁)\nR = (17.1 − 1.48)/(17.1 + 1.48) = 15.62/18.58 = 0.84, so 84.0 % of the amplitude comes back (A).\nThe common trap is D, 70.6 %. That is R², the reflected ENERGY. The question asks for AMPLITUDE, so do not square it.\nThe other wrong options come from slips: B is Z₁/Z₂ = 0.087, and C is 1 − R = 16 %.","s":{"title":"Water to aluminum, normal incidence","xlim":[0,10],"ylim":[0,6],"equal":false,"items":[{"type":"rect","xy":[0,1],"w":5,"h":4,"color":"water","label":""},{"type":"rect","xy":[5,1],"w":5,"h":4,"color":"steel","label":""},{"type":"text","xy":[2.5,5.4],"text":"Water Z=1.48","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[7.5,5.4],"text":"Aluminum Z=17.1","color":"ink","size":9,"anchor":"middle"},{"type":"arrow","from":[0.5,3.5],"to":[4.9,3.5],"color":"blue"},{"type":"text","xy":[0.5,3.8],"text":"Sent 100%","color":"blue","size":9,"anchor":"start"},{"type":"arrow","from":[4.9,2.2],"to":[0.5,2.2],"color":"red"},{"type":"text","xy":[0.5,1.7],"text":"Back 84%","color":"red","size":9,"anchor":"start"},{"type":"arrow","from":[5.1,3],"to":[9.5,3],"color":"green"},{"type":"text","xy":[9.5,3.4],"text":"Passes 184%","color":"green","size":9,"anchor":"end"},{"type":"text","xy":[7.5,1.5],"text":"Energy back: 70.6%","color":"amber","size":9,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"I","k":"calc","q":"Echo A is at 60 % FSH and echo B at 30 % FSH (same gain). How many dB is echo B below echo A?","o":[["12.0 dB",0,"Check the log: a factor of 2 in amplitude is 6 dB."],["6.0 dB",1,""],["30.0 dB",0,"dB is a logarithmic ratio, not the difference in % FSH."],["3.0 dB",0,"10·log is for POWER/energy ratios. Screen amplitude uses 20·log."]],"s":"dB = 20 log₁₀(A₂ / A₁) = 20 log₁₀(30/60) = -6.0 dB.\nRemember: ×2 = 6 dB, ×10 = 20 dB.","h":"Amplitude ratio → 20 log₁₀. Doubling = +6 dB.","d":null,"x":{"e":"Think of the screen as a ruler. Echo B is exactly half as tall as echo A (30 ÷ 60 = 0.5).\n\nIn UT, one simple fact does most of the work: **half the height (or double it) = 6 dB**.\n\nSo B is 6 dB below A.\n\nFormula: dB = 20 log₁₀(30/60) = 20 × (−0.301) = −6.0 dB. The minus sign just means \"smaller\".\n\nCommon traps:\n• **30 dB**: you subtract the percentages (60 − 30). dB works on ratios, not differences.\n• **3 dB**: you use 10 log, which is for power or intensity. Echo height on the screen is amplitude, so use 20 log.\n• **12 dB**: that would be a factor of 4 (6 dB twice), but here the ratio is only 2.\n\nMemory aid: ×2 = 6 dB, ×10 = 20 dB.","s":{"title":"Half the height = 6 dB down","xlim":[0,10],"ylim":[-10,115],"items":[{"type":"line","x":[0,10],"y":[0,0],"color":"ink","dashed":false,"width":2},{"type":"line","x":[0,10],"y":[100,100],"color":"gray","dashed":true,"width":1},{"type":"text","xy":[0.2,105],"text":"100% FSH","color":"gray","size":9,"anchor":"start"},{"type":"rect","xy":[2,0],"w":1.5,"h":60,"color":"water","label":"A 60%"},{"type":"rect","xy":[6,0],"w":1.5,"h":30,"color":"wedge","label":"B 30%"},{"type":"line","x":[3.5,7.8],"y":[60,60],"color":"red","dashed":true,"width":1},{"type":"arrow","from":[7.8,60],"to":[7.8,30],"color":"red"},{"type":"text","xy":[8.0,45],"text":"-6 dB","color":"red","size":10,"anchor":"start"},{"type":"text","xy":[5,80],"text":"B = half of A","color":"ink","size":10,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"I","k":"calc","q":"Echo A is at 100 % FSH and echo B at 50 % FSH (same gain). How many dB is echo B below echo A?","o":[["50.0 dB",0,"dB is a logarithmic ratio, not the difference in % FSH."],["6.0 dB",1,""],["3.0 dB",0,"10·log is for POWER/energy ratios. Screen amplitude uses 20·log."],["12.0 dB",0,"Check the log: a factor of 2 in amplitude is 6 dB."]],"s":"dB = 20 log₁₀(A₂ / A₁) = 20 log₁₀(50/100) = -6.0 dB.\nRemember: ×2 = 6 dB, ×10 = 20 dB.","h":"Amplitude ratio → 20 log₁₀. Doubling = +6 dB.","d":null,"x":{"e":"Think of decibels as a 'how many times bigger?' ruler for signal height.\nOne rule to remember: every time the echo height doubles, you add 6 dB. Every time it halves, you lose 6 dB.\nEcho B is exactly half as tall as echo A (50 % vs 100 %). Half = one halving step = 6 dB lower.\nFormula for amplitude: dB = 20 log₁₀(A₂/A₁) = 20 log₁₀(0.5) = -6.0 dB.\nSo B is 6 dB below A.\n\nCommon trap: 3.0 dB. That comes from using 10 log instead of 20 log. 10 log is for power or intensity. Screen height is amplitude (pressure), so you must use 20 log.\nAnother trap: reading '50 %' as '50 dB'. Percent and dB are different units.\n\nQuick memory: ×2 = 6 dB, ×10 = 20 dB.","s":{"title":"Half the height = 6 dB lower","xlim":[0,10],"ylim":[0,11],"equal":false,"items":[{"type":"rect","xy":[0.5,0.5],"w":9,"h":10,"color":"air","label":""},{"type":"line","x":[1,8],"y":[1,1],"color":"ink","dashed":false,"width":2},{"type":"line","x":[3,3],"y":[1,9],"color":"blue","dashed":false,"width":6},{"type":"line","x":[6,6],"y":[1,5],"color":"red","dashed":false,"width":6},{"type":"text","xy":[3,9.6],"text":"A: 100 %","color":"blue","size":10,"anchor":"middle"},{"type":"text","xy":[6,5.6],"text":"B: 50 %","color":"red","size":10,"anchor":"middle"},{"type":"line","x":[3,8],"y":[9,9],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[7.8,9],"to":[7.8,5],"color":"green"},{"type":"text","xy":[8.1,7],"text":"-6 dB","color":"green","size":10,"anchor":"start"}]}}},{"t":"Decibels & attenuation","l":"I","k":"calc","q":"Echo A is at 40 % FSH and echo B at 20 % FSH (same gain). How many dB is echo B below echo A?","o":[["12.0 dB",0,"Check the log: a factor of 2 in amplitude is 6 dB."],["3.0 dB",0,"10·log is for POWER/energy ratios. Screen amplitude uses 20·log."],["20.0 dB",0,"dB is a logarithmic ratio, not the difference in % FSH."],["6.0 dB",1,""]],"s":"dB = 20 log₁₀(A₂ / A₁) = 20 log₁₀(20/40) = -6.0 dB.\nRemember: ×2 = 6 dB, ×10 = 20 dB.","h":"Amplitude ratio → 20 log₁₀. Doubling = +6 dB.","d":null,"x":{"e":"Think of the echo height as a ruler. The dB scale just tells you how many times taller or shorter one echo is than another.\nEcho B is 20 % and echo A is 40 %, so B is exactly half of A. The ratio is 20/40 = 0.5.\nOn the dB scale, doubling the height is +6 dB and halving it is -6 dB. So B is 6 dB below A.\nFormula: dB = 20 log₁₀(A₂/A₁) = 20 log₁₀(0.5) = -6.0 dB.\nCommon trap: 3.0 dB. That comes f t differences.\nAlso watch for:\n• 6.0 dB: you counted only one halving, or treated the ratio of 4 as 2.\n• 24.1 dB: you used 40 log instead of 20 log. Amplitude uses 20 log, so don't double it.\n\nRemember: ×2 = 6 dB, ×10 = 20 dB.","s":{"title":"80 % to 20 % is two halvings","xlim":[0,10],"ylim":[-10,108],"equal":false,"items":[{"type":"line","x":[0.5,9.5],"y":[0,0],"color":"gray","dashed":false,"width":2},{"type":"rect","xy":[1,0],"w":1.5,"h":80,"color":"#4a90d9","label":""},{"type":"rect","xy":[4,0],"w":1.5,"h":40,"color":"#8bb8e8","label":""},{"type":"rect","xy":[7,0],"w":1.5,"h":20,"color":"#c5dbf3","label":""},{"type":"text","xy":[1.75,85],"text":"A: 80 %","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[4.75,45],"text":"40 %","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[7.75,25],"text":"B: 20 %","color":"ink","size":9,"anchor":"middle"},{"type":"arrow","from":[2.7,65],"to":[3.9,48],"color":"red"},{"type":"text","xy":[3.3,72],"text":"−6 dB","color":"red","size":9,"anchor":"middle"},{"type":"arrow","from":[5.7,38],"to":[6.9,28],"color":"red"},{"type":"text","xy":[6.3,48],"text":"−6 dB","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[5,100],"text":"Total = −12 dB","color":"green","size":10,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"I","k":"calc","q":"Echo A is at 100 % FSH and echo B at 25 % FSH (same gain). How many dB is echo B below echo A?","o":[["75.0 dB",0,"dB is a logarithmic ratio, not the difference in % FSH."],["6.0 dB",0,"10·log is for POWER/energy ratios. Screen amplitude uses 20·log."],["24.1 dB",0,"Check the log: a factor of 2 in amplitude is 6 dB."],["12.0 dB",1,""]],"s":"dB = 20 log₁₀(A₂ / A₁) = 20 log₁₀(25/100) = -12.0 dB.\nRemember: ×2 = 6 dB, ×10 = 20 dB.","h":"Amplitude ratio → 20 log₁₀. Doubling = +6 dB.","d":null,"x":{"e":"Think of decibels as a 'how many times bigger or smaller' scale, not a 'how many percent apart' scale.\nEvery time the echo height is cut in half, you lose 6 d og(0.1) = −20 dB","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"I","k":"calc","q":"Echo A is at 100 % FSH and echo B at 10 % FSH (same gain). How many dB is echo B below echo A?","o":[["20.0 dB",1,""],["90.0 dB",0,"dB is a logarithmic ratio, not the difference in % FSH."],["10.0 dB",0,"10·log is for POWER/energy ratios. Screen amplitude uses 20·log."],["40.0 dB",0,"Check the log: a factor of 2 in amplitude is 6 dB."]],"s":"dB = 20 log₁₀(A₂ / A₁) = 20 log₁₀(10/100) = -20.0 dB.\nRemember: ×2 = 6 dB, ×10 = 20 dB.","h":"Amplitude ratio → 20 log₁₀. Doubling = +6 dB.","d":null,"x":{"e":"Think of dB as a ruler that counts in ratios, not in subtraction.\nEcho B is 10 times smaller than echo A (100 % → 10 %). A 10× drop in amplitude is always 20 dB. B is below A, so it is -20 dB, which means 20 dB lower.\nFormula: dB = 20 log₁₀(A₂/A₁) = 20 log₁₀(0.1) = -20 dB.\nMemory aid: ×2 = 6 dB, ×10 = 20 dB.\n\nCommon traps:\n• 90 dB: you subtract the percentages (100 - 10 = 90). dB never works on differences. It works on ratios.\n• 10 dB: you use 10 log. That formula is for power or intensity. Echo height on the screen is amplitude, so use 20 log.","s":{"title":"10× smaller echo = 20 dB drop","xlim":[0,12],"ylim":[-2,12],"equal":false,"items":[{"type":"rect","xy":[0,0],"w":12,"h":11,"color":"air","label":""},{"type":"rect","xy":[2,0],"w":1.5,"h":10,"color":"water","label":""},{"type":"rect","xy":[6,0],"w":1.5,"h":1,"color":"steel","label":""},{"type":"text","xy":[2.75,-1],"text":"A: 100 %","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[6.75,-1],"text":"B: 10 %","color":"ink","size":9,"anchor":"middle"},{"type":"line","x":[3.5,8.3],"y":[10,10],"color":"amber","dashed":true,"width":2},{"type":"arrow","from":[8.3,10],"to":[8.3,1],"color":"red"},{"type":"text","xy":[8.6,5.5],"text":"÷10 = -20 dB","color":"red","size":9,"anchor":"start"}]}}},{"t":"Decibels & attenuation","l":"I","k":"calc","q":"Echo A is at 60 % FSH and echo B at 15 % FSH (same gain). How many dB is echo B below echo A?","o":[["24.1 dB",0,"Check the log: a factor of 2 in amplitude is 6 dB."],["6.0 dB",0,"10·log is for POWER/energy ratios. Screen amplitude uses 20·log."],["45.0 dB",0,"dB is a logarithmic ratio, not the difference in % FSH."],["12.0 dB",1,""]],"s":"dB = 20 log₁₀(A₂ / A₁) = 20 log₁₀(15/60) = -12.0 dB.\nRemember: ×2 = 6 dB, ×10 = 20 dB.","h":"Amplitude ratio → 20 log₁₀. Doubling = +6 dB.","d":null,"x":{"e":"Think of dB as a 'how many times bigger or smaller' scale. Every time the echo height is cut in half, you lose 6 dB.\n\nStart at 60 %. Half is 30 % (that is -6 dB). Half again is 15 % (another -6 dB). So 60 % to 15 % is two halvings: 6 + 6 = 12 dB.\n\nFormula: dB = 20 log₁₀(15/60) = 20 log₁₀(0.25) = -12 dB. B is 12 dB below A.\n\nCommon traps:\n• C (45 dB): subtracting 60 - 15 = 45. Percentages are NOT dB. dB depends on the ratio, not the difference.\n• B (6 dB): halving only once, or using 10 log (the power formula) instead of 20 log for amplitude.\n• A (24.1 dB): using 40 log, which doubles the answer.\n\nMemory aid: ×2 = 6 dB, ×4 = 12 dB, ×10 = 20 dB.","s":{"title":"Two halvings = 12 dB","xlim":[0,9],"ylim":[-5,72],"equal":false,"items":[{"type":"line","x":[0.5,8.5],"y":[0,0],"color":"ink","dashed":false,"width":2},{"type":"rect","xy":[1,0],"w":1.5,"h":60,"color":"#3b82f6"},{"type":"rect","xy":[3.5,0],"w":1.5,"h":30,"color":"#bbbbbb"},{"type":"rect","xy":[6,0],"w":1.5,"h":15,"color":"#f59e0b"},{"type":"text","xy":[1.75,-4],"text":"A: 60 %","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[4.25,-4],"text":"30 %","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[6.75,-4],"text":"B: 15 %","color":"ink","size":9,"anchor":"middle"},{"type":"arrow","from":[2.6,56],"to":[3.8,32],"color":"red"},{"type":"text","xy":[4.6,45],"text":"-6 dB","color":"red","size":9,"anchor":"middle"},{"type":"arrow","from":[5.2,28],"to":[6,18],"color":"red"},{"type":"text","xy":[6.9,26],"text":"-6 dB","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[4.5,68],"text":"Total: -12 dB","color":"green","size":10,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"I","k":"calc","q":"Echo A is at 40 % FSH and echo B at 80 % FSH (same gain). How many dB is echo B above echo A?","o":[["40.0 dB",0,"dB is a logarithmic ratio, not the difference in % FSH."],["6.0 dB",1,""],["12.0 dB",0,"Check the log: a factor of 2 in amplitude is 6 dB."],["3.0 dB",0,"10·log is for POWER/energy ratios. Screen amplitude uses 20·log."]],"s":"dB = 20 log₁₀(A₂ / A₁) = 20 log₁₀(80/40) = +6.0 dB.\nRemember: ×2 = 6 dB, ×10 = 20 dB.","h":"Amplitude ratio → 20 log₁₀. Doubling = +6 dB.","d":null,"x":{"e":"Think of dB as a way to compare two heights by asking 'how many times bigger?' It does not ask 'how much bigger?'.\n\nEcho A is 40 % and echo B is 80 %. Divide: 80 ÷ 40 = 2. Echo B is twice as tall.\n\nFor signal amplitude, the formula is dB = 20 × log₁₀(ratio). Here that is 20 × log₁₀(2) = 20 × 0.301 = +6 dB.\n\nMemory trick: ×2 = 6 dB, ×10 = 20 dB.\n\nCommon trap: subtracting the heights. 80 − 40 = 40, so people pick '40 dB'. But dB uses a ratio, never a difference. Check it: 40 % → 80 % is the same ×2 jump as 20 % → 40 %, and both are 6 dB.\n\nTwo other traps:\n• 3 dB comes from 10 log, which is the power formula. Amplitude uses 20 log.\n• 12 dB is a ×4 change, which is two doublings (6 + 6).","s":{"title":"Ratio 80 / 40 = 2 → +6 dB","xlim":[0,12],"ylim":[0,100],"equal":false,"items":[{"type":"rect","xy":[0,0],"w":12,"h":100,"color":"air","label":""},{"type":"rect","xy":[2,0],"w":1.5,"h":40,"color":"#4a90d9","label":""},{"type":"rect","xy":[6,0],"w":1.5,"h":80,"color":"#4a90d9","label":""},{"type":"text","xy":[2.75,46],"text":"A: 40 %","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[6.75,86],"text":"B: 80 %","color":"ink","size":9,"anchor":"middle"},{"type":"line","x":[2,8.6],"y":[40,40],"color":"red","dashed":true,"width":1},{"type":"arrow","from":[8.6,40],"to":[8.6,80],"color":"green"},{"type":"text","xy":[8.9,60],"text":"×2 = +6 dB","color":"green","size":9,"anchor":"start"},{"type":"text","xy":[6,95],"text":"Screen height (% FSH)","color":"gray","size":8,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"III","k":"calc","q":"The material attenuation is 0.04 dB/mm (one way). How much does the back-wall echo of a 150 mm thick part lose to attenuation in pulse-echo?","o":[["16.9 dB",0,"Attenuation in dB/mm is simply multiplied by the path length."],["12.0 dB",1,""],["24.0 dB",0,"The path is 2 × thickness, not 4 ×."],["6.0 dB",0,"Pulse-echo: the sound travels the thickness twice, so the path is 2 × thickness."]],"s":"Loss = α × path = 0.04 dB/mm × (2 × 150 mm) = 12.0 dB.","h":"dB loss = attenuation (dB/mm) × total sound path.","d":null,"x":{"e":"Think of shouting at a cliff and hearing the echo. Your voice fades going out, and fades again coming back.\nIn pulse-echo the sound travels to the back wall AND returns, so it crosses the part twice.\n\nStep 1: Path = 2 × 150 mm = 300 mm.\nStep 2: Loss = 0.04 dB/mm × 300 mm = 12.0 dB.\n(Same as 6 dB down + 6 dB back.)\n\nCommon trap: D (6.0 dB). It uses only the one-way path (0.04 × 150) and forgets the round trip. The 0.04 dB/mm is per mm of travel, and the sound travels 300 mm.\n\nC (24 dB) doubles twice. The path is already doubled, so do not double the answer again.\n\nRule: Attenuation loss (dB) = α (dB/mm) × total sound path (mm). In pulse-echo, total path = 2 × thickness.","s":{"title":"Round trip = 300 mm of travel","xlim":[-10,150],"ylim":[-175,30],"equal":false,"items":[{"type":"rect","xy":[0,-150],"w":60,"h":150,"color":"steel","label":"Steel 150 mm"},{"type":"rect","xy":[15,0],"w":30,"h":12,"color":"wedge","label":"Probe"},{"type":"arrow","from":[22,0],"to":[22,-148],"color":"blue"},{"type":"arrow","from":[38,-148],"to":[38,0],"color":"green"},{"type":"text","xy":[68,-45],"text":"Down: 150 mm = 6 dB","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[68,-85],"text":"Up: 150 mm = 6 dB","color":"green","size":9,"anchor":"start"},{"type":"text","xy":[68,-125],"text":"Total 300 mm = 12 dB","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[30,-165],"text":"Back wall","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"III","k":"calc","q":"The material attenuation is 0.02 dB/mm (one way). How much does the back-wall echo of a 50 mm thick part lose to attenuation in pulse-echo?","o":[["4.0 dB",0,"The path is 2 × thickness, not 4 ×."],["2.0 dB",1,""],["1.0 dB",0,"Pulse-echo: the sound travels the thickness twice, so the path is 2 × thickness."],["6.0 dB",0,"Attenuation in dB/mm is simply multiplied by the path length."]],"s":"Loss = α × path = 0.02 dB/mm × (2 × 50 mm) = 2.0 dB.","h":"dB loss = attenuation (dB/mm) × total sound path.","d":null,"x":{"e":"Think of a shout echoing off a far wall. The sound must travel to the wall and back, and it gets weaker the whole way.\n\nIn pulse-echo, the pulse crosses the 50 mm part, hits the back wall, then crosses 50 mm again. That is 100 mm of travel.\n\nThe 0.02 dB/mm value is per mm of travel, so:\nLoss = α × total path = 0.02 × (2 × 50) = 2.0 dB.\n\nCommon trap: C (1.0 dB). It uses only the one-way 50 mm and forgets the return trip. The problem says \"one way\" to tempt you into this.\n\nA (4.0 dB) double-counts the round trip, and D (6.0 dB) mixes in the \"6 dB = double the amplitude\" rule, which has nothing to do with this calculation.\n\nRule: in pulse-echo, always use path = 2 × thickness.","s":{"title":"Round trip = 2 × 50 mm","xlim":[-5,105],"ylim":[-60,15],"equal":false,"items":[{"type":"rect","xy":[0,-50],"w":40,"h":50,"color":"steel","label":"Steel 50 mm"},{"type":"rect","xy":[14,0],"w":12,"h":6,"color":"wedge","label":"Probe"},{"type":"arrow","from":[17,-1],"to":[17,-49],"color":"blue"},{"type":"arrow","from":[23,-49],"to":[23,-1],"color":"red"},{"type":"text","xy":[46,-15],"text":"Down: 50 mm = 1 dB","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[46,-30],"text":"Up: 50 mm = 1 dB","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[46,-45],"text":"Total = 2.0 dB","color":"green","size":10,"anchor":"start"}]}}},{"t":"Decibels & attenuation","l":"III","k":"calc","q":"The material attenuation is 0.05 dB/mm (one way). How much does the back-wall echo of a 150 mm thick part lose to attenuation in pulse-echo?","o":[["18.6 dB",0,"Attenuation in dB/mm is simply multiplied by the path length."],["7.5 dB",0,"Pulse-echo: the sound travels the thickness twice, so the path is 2 × thickness."],["30.0 dB",0,"The path is 2 × thickness, not 4 ×."],["15.0 dB",1,""]],"s":"Loss = α × path = 0.05 dB/mm × (2 × 150 mm) = 15.0 dB.","h":"dB loss = attenuation (dB/mm) × total sound path.","d":null,"x":{"e":"Think of shouting at a cliff and hearing the echo. Your voice fades on the way there AND on the way back.\n\nIn pulse-echo, the sound goes down to the back wall and returns to the probe. So the path is 2 × 150 mm = 300 mm.\n\nEach millimetre costs 0.05 dB, so the loss is 300 × 0.05 = 15 dB.\n\nFormula: Loss (dB) = α × 2 × thickness = 0.05 × 2 × 150 = 15.0 dB.\n\nCommon trap: B (7.5 dB). That is 0.05 × 150, which counts only the trip down and forgets the trip back. The α is given \"one way\", so you must double the distance.\n\nC (30 dB) doubles twice by mistake. A (18.6 dB) is just a random-looking number that does not come from this calculation.","s":{"title":"Round trip = 2 × 150 mm","xlim":[-40,150],"ylim":[-190,35],"equal":false,"items":[{"type":"rect","xy":[0,-150],"w":60,"h":150,"color":"steel"},{"type":"rect","xy":[15,0],"w":30,"h":15,"color":"wedge","label":"Probe"},{"type":"arrow","from":[22,0],"to":[22,-148],"color":"blue"},{"type":"arrow","from":[38,-148],"to":[38,0],"color":"red"},{"type":"line","x":[0,60],"y":[-150,-150],"color":"ink","dashed":false,"width":3},{"type":"text","xy":[70,-35],"text":"Down: 7.5 dB","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[70,-75],"text":"Bac or":"start"},{"type":"text","xy":[48,-110],"text":"Up: 10 dB","color":"red","size":10,"anchor":"start"},{"type":"text","xy":[48,-170],"text":"Total: 20 dB","color":"green","size":11,"anchor":"start"},{"type":"text","xy":[20,-220],"text":"Back wall","color":"ink","size":9,"anchor":"middle"}]}}},{"t":"Decibels & attenuation","l":"III","k":"calc","q":"The material attenuation is 0.01 dB/mm (one way). How much does the back-wall echo of a 100 mm thick part lose to attenuation in pulse-echo?","o":[["6.0 dB",0,"Attenuation in dB/mm is simply multiplied by the path length."],["4.0 dB",0,"The path is 2 × thickness, not 4 ×."],["1.0 dB",0,"Pulse-echo: the sound travels the thickness twice, so the path is 2 × thickness."],["2.0 dB",1,""]],"s":"Loss = α × path = 0.01 dB/mm × (2 × 100 mm) = 2.0 dB.","h":"dB loss = attenuation (dB/mm) × total sound path.","d":null,"x":{"e":"Think of shouting at a cliff. Your voice goes to the cliff and comes back, so it travels the distance twice.\n\nUltrasound does the same. The pulse goes down 100 mm to the back wall, then returns 100 mm to the probe. The total path is 200 mm.\n\nThe material takes 0.01 dB away for every mm of path.\n\nLoss = α × path\nLoss = 0.01 dB/mm × (2 × 100 mm) = 2.0 dB\n\nThat is 1 dB on the way down plus 1 dB on the way back.\n\nMost common trap: C (1.0 dB). It uses only the one-way 100 mm and forgets the return trip. The 0.01 dB/mm is one-way, so in pulse-echo you must always multiply the thickness by 2.\n\nA and B come from counting more path than really exists, so check that the path is 2 × thickness and no more.","s":{"title":"Pulse-echo path = 2 × thickness","xlim":[-60,100],"ylim":[-125,20],"equal":false,"items":[{"type":"rect","xy":[0,-100],"w":60,"h":100,"color":"steel","label":"Steel 100 mm"},{"type":"rect","xy":[20,1],"w":20,"h":9,"color":"wedge","label":"Probe"},{"type":"arrow","from":[25,0],"to":[25,-97],"color":"blue"},{"type":"arrow","from":[35,-97],"to":[35,-2],"color":"red"},{"type":"line","x":[0,60]," to double the path.\nOption C (8.0 dB) doubles the path a second time by mistake.\nTip: always ask, \"How far did the sound actually travel?\" In pulse-echo, it is twice the thickness.","s":{"title":"Pulse-echo: the sound travels twice","xlim":[-60,230],"ylim":[-260,30],"equal":false,"items":[{"type":"rect","xy":[0,-200],"w":100,"h":200,"color":"steel"},{"type":"rect","xy":[35,0],"w":30,"h":14,"color":"wedge"},{"type":"text","xy":[-5,8],"text":"Probe","color":"ink","size":9,"anchor":"end"},{"type":"arrow","from":[42,0],"to":[42,-200],"color":"blue"},{"type":"arrow","from":[58,-200],"to":[58,0],"color":"red"},{"type":"text","xy":[110,-60],"text":"Down: 200 mm = 2 dB","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[110,-140],"text":"Up: 200 mm = 2 dB","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[-5,-200],"text":"Back wall","color":"ink","size":9,"anchor":"end"},{"type":"text","xy":[50,-235],"text":"Total 400 mm = 4 dB","color":"ink","size":10,"anchor":"middle"}]}}},{"t":"Angle-beam geometry","l":"II","k":"calc","q":"A 60° shear-wave probe shows a reflector at a sound path of 50 mm (first leg, plate 30 mm thick). What is the reflector's DEPTH below the surface?","o":[["100.0 mm",0,"You divided by cos θ; the sound path is the hypotenuse, so multiply."],["86.6 mm",0,"tan θ gives the surface distance per unit DEPTH, not per sound path."],["25.0 mm",1,""],["43.3 mm",0,"sin and cos are swapped. Depth = S·cos θ, surface distance = S·sin θ (θ from the normal)."]],"s":"The sound path S is the hypotenuse; θ is measured from the normal.\nDepth = S cos θ = 50 × cos 60° = 25.0 mm\nSurface distance = S sin θ = 50 × sin 60° = 43.3 mm","h":"Draw the triangle: sound path = hypotenuse, depth = adjacent (cos), surface distance = opposite (sin).","d":{"xlim":[-9.09,78.5],"ylim":[-38.49,10.91],"items":[{"type":"rect","xy":[-7.27,-30.0],"w":85.78,"h":30.0,"color":"steel"},{"type":"text","xy":[76.08,-26.97],"text":"plate T = 30 mm","color":"ink","anchor":"end","size":11},{"type":"rect","xy":[-6.06,0],"w":12.12,"h":7.27,"color":"wedge"},{"type":"line","x":[0,0],"y":[-30.0,1.21],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[0,0],"to":[43.3,-25.0],"color":"blue"},{"type":"circle","xy":[43.3,-25.0],"r":2.12,"color":"red","fill":true},{"type":"line","x":[43.3,43.3],"y":[0,-25.0],"color":"amber","dashed":true,"width":1.4},{"type":"text","xy":[45.73,-12.5],"text":"depth","color":"amber","anchor":"start"},{"type":"text","xy":[21.65,3.64],"text":"surface dist.","color":"amber"},{"type":"text","xy":[25.89,-11.29],"text":"S = 50","color":"blue","anchor":"start"},{"type":"text","xy":[-1.82,-4.2],"text":"60°","color":"ink","anchor":"end"}]},"x":{"e":"Think of the beam as a ladder leaning on a wall. The ladder is the 50 mm sound path. The wall is the depth. The ground is the distance along the surface.\n\nThe 60° angle is measured from the NORMAL, the line pointing straight down. So the beam is tilted well away from vertical, and it goes more sideways than down. That means depth must be the smaller number.\n\nRule: depth = S × cos θ = 50 × cos 60° = 50 × 0.5 = 25 mm.\nSurface distance = S × sin θ = 50 × 0.866 = 43.3 mm.\n\nThe plate is 30 mm thick and 25 mm is less than 30 mm, so the echo is on the first leg, with no bounce to correct for.\n\nCommon trap: option D (43.3 mm). That is the surface distance, which you get by swapping sin and cos, or by measuring the angle from the surface instead of the normal. Options A and B also break the rule that the depth cannot be bigger than the sound path itself. Check: the depth should never exceed 50 mm.","s":{"title":"60° beam, S = 50 mm","xlim":[-12,75],"ylim":[-34,10],"equal":true,"items":[{"type":"rect","xy":[-10,-30],"w":80,"h":30,"color":"steel"},{"type":"rect","xy":[-10,0],"w":10,"h":6,"color":"wedge","label":"Probe"},{"type":"line","x":[0,43.3],"y":[0,-25],"color":"blue","width":3},{"type":"line","x":[0,0],"y":[0,-25],"color":"green","width":3},{"type":"line","x":[0,4 t","xy":[19.68,-8.84],"text":"depth","color":"amber","anchor":"start"},{"type":"text","xy":[8.84,3.0],"text":"surface dist.","color":"amber"},{"type":"text","xy":[12.34,-7.84],"text":"S = 25","color":"blue","anchor":"start"},{"type":"text","xy":[-1.5,-7.0],"text":"45°","color":"ink","anchor":"end"}]},"x":{"e":"Think of the beam as a ladder leaning on a wall. The ladder is the sound path (25 mm). It is the slanted line, not the distance along the ground.\nThe probe angle is measured from the normal (the straight-down line). So:\n• Sideways distance on the surface = S × sin θ\n• Depth below the surface = S × cos θ\nHere: 25 × sin 45° = 25 × 0.707 = 17.7 mm.\nAt 45°, sin and cos are equal, so depth is also 17.7 mm. The reflector is well inside the 50 mm plate on the first leg, so no bounce correction is needed.\nMost common trap: D (25.0 mm). It uses the sound path as if it were the surface distance. The slanted side of a triangle is always longer than the flat side. C (35.4 mm) comes from multiplying by 1.414 instead of 0.707, which goes the wrong way. Remember: surface distance is always shorter than the sound path.\nFormula: Surface distance = S sin θ.","s":{"title":"45° beam, first leg","xlim":[-10,40],"ylim":[-30,9],"equal":true,"items":[{"type":"rect","xy":[-10,-30],"w":50,"h":30,"color":"steel","label":"Steel plate"},{"type":"rect","xy":[-8,0],"w":8,"h":4,"color":"wedge","label":"Probe"},{"type":"line","x":[0,0],"y":[0,-15],"color":"gray","dashed":true,"width":1},{"type":"line","x":[0,17.7],"y":[0,-17.7],"color":"blue","dashed":false,"width":2},{"type":"arrow","from":[0,3],"to":[17.7,3],"color":"green"},{"type":"text","xy":[9,6],"text":"Surface 17.7 mm","color":"green","size":9,"anchor":"middle"},{"type":"line","x":[17.7,17.7],"y":[0,-17.7],"color":"red","dashed":true,"width":1},{"type":"text","xy":[19.5,-9],"text":"Depth 17.7 mm","color":"red","size":9,"anchor":"start"},{"type":"circle","xy":[17.7,-17.7],"r":1.2,"color":"red","fill":true},{"type":"text","xy":[5,-13],"text":"Path 25 mm","color":"blue","size":9,"anchor":"end"},{"type":"text","xy":[1.5,-8],"text":"45°","color":"ink","size":9,"anchor":"start"}]}}},{"t":"Angle-beam geometry","l":"II","k":"calc","q":"A 60° shear-wave probe shows a reflector at a sound path of 35 mm (first leg, plate 25 mm thick). What is the reflector's SURFACE DISTANCE from the beam index point?","o":[["70.0 mm",0,"You divided by cos θ; the sound path is the hypotenuse, so multiply."],["60.6 mm",0,"tan θ gives the surface distance per unit DEPTH, not per sound path."],["30.3 mm",1,""],["17.5 mm",0,"sin and cos are swapped. Depth = S·cos θ, surface distance = S·sin θ (θ from the normal)."]],"s":"The sound path S is the hypotenuse; θ is measured from the normal.\nDepth = S cos θ = 35 × cos 60° = 17.5 mm\nSurface distance = S sin θ = 35 × sin 60° = 30.3 mm","h":"Draw the triangle: sound path = hypotenuse, depth = adjacent (cos), surface distance = opposite (sin).","d":{"xlim":[-6.37,57.95],"ylim":[-30.94,7.64],"items":[{"type":"rect","xy":[-5.09,-25.0],"w":63.04,"h":25.0,"color":"steel"},{"type":"text","xy":[56.25,-22.88],"text":"plate T = 25 mm","color":"ink","anchor":"end","size":11},{"type":"rect","xy":[-4.24,0],"w":8.49,"h":5.09,"color":"wedge"},{"type":"line","x":[0,0],"y":[-25.0,0.85],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[0,0],"to":[30.31,-17.5],"color":"blue"},{"type":"circle","xy":[30.31,-17.5],"r":1.66,"color":"red","fill":true},{"type":"line","x":[30.31,30.31],"y":[0,-17.5],"color":"amber","dashed":true,"width":1.4},{"type":"text","xy":[32.01,-8.75],"text":"depth","color":"amber","anchor":"start"},{"type":"text","xy":[15.16,2.55],"text":"surface dist.","color":"amber"},{"type":"text","xy":[18.13,-7.9],"text":"S = 35","color":"blue","anchor":"start"},{"type":"text","xy":[-1.27,-3.5],"text":"60°","color":"ink","anchor":"end"}]},"x":{"e":"Think of the beam as a ladder leaning against a wall. The ladder is the sound path (35 mm). The floor distance is the surface distance. The wall height is the depth.\nThe probe angle (60°) is measured from the normal, which is the vertical line. So the angle sits between the beam and the vertical.\nThe side opposite that angle is the sideways (surface) distance, so it uses sine. The side next to it is the depth, so it uses cosine.\nSurface distance = S × sin θ = 35 × sin 60° = 35 × 0.866 = 30.3 mm.\nDepth = S × cos θ = 35 × 0.5 = 17.5 mm.\nCommon trap: swapping sin and cos. That gives 17.5 mm (option D), which is the depth, not the surface distance. Options A (70 mm) and B (60.6 mm) are double values (2 × 35 and 2 × 30.3), so they ignore that this is the first leg with no bounce yet.\nQuick check: at 60°, the beam is steep to the side, so the surface distance should be bigger than the depth. 30.3 > 17.5 passes.","s":{"title":"60° beam, first leg","xlim":[-15,58],"ylim":[-30,10],"equal":true,"items":[{"type":"rect","xy":[-10,-25],"w":55,"h":25,"color":"steel","label":""},{"type":"line","x":[0,30.3],"y":[0,-17.5],"color":"blue","dashed":false,"width":3},{"type":"line","x":[0,0],"y":[0,-25],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[0,3],"to":[30.3,3],"color":"green"},{"type":"text","xy":[15,5.5],"text":"Surface 30.3 mm","color":"green","size":9,"anchor":"middle"},{"type":"line","x":[30.3,30.3],"y":[0,-17.5],"color":"amber","dashed":true,"width":2},{"type":"text","xy":[32.5,-9],"text":"Depth 17.5 mm","color":"amber","size":9,"anchor":"start"},{"type":"circle","xy":[30.3,-17.5],"r":1.5,"color":"red","fill":true},{"type":"text","xy":[4,-11],"text":"60°","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[9,-17],"text":"Path 35 mm","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[-2,3],"text":"Index","color":"ink","size":9,"anchor":"end"}]}}},{"t":"Angle-beam geometry","l":"II","k":"calc","q":"A 60° shear-wave probe shows a reflector at a sound path of 44.1 mm (first leg, plate 25 mm thick). What is the reflector's DEPTH below the surface?","o":[["76.4 mm",0,"tan θ gives the surface distance per unit DEPTH, not per sound path."],["38.2 mm",0,"sin and cos are swapped. Depth = S·cos θ, surface distance = S·sin θ (θ from the normal)."],["22.1 mm",1,""],["88.2 mm",0,"You divided by cos θ; the sound path is the hypotenuse, so multiply."]],"s":"The sound path S is the hypotenuse; θ is measured from the normal.\nDepth = S cos θ = 44.1 × cos 60° = 22.1 mm\nSurface distance = S sin θ = 44.1 × sin 60° = 38.2 mm","h":"Draw the triangle: sound path = hypotenuse, depth = adjacent (cos), surface distance = opposite (sin).","d":{"xlim":[-8.02,70.42],"ylim":[-32.49,9.62],"items":[{"type":"rect","xy":[-6.42,-25.0],"w":76.84,"h":25.0,"color":"steel"},{"type":"text","xy":[68.28,-22.33],"text":"plate T = 25 mm","color":"ink","anchor":"end","size":11},{"type":"rect","xy":[-5.35,0],"w":10.69,"h":6.42,"color":"wedge"},{"type":"line","x":[0,0],"y":[-25.0,1.07],"color":"gray","dashed":true,"width":1},{"type":"arrow","from":[0,0],"to":[38.19,-22.05],"color":"blue"},{"type":"circle","xy":[38.19,-22.05],"r":1.94,"color":"red","fill":true},{"type":"line","x":[38.19,38.19],"y":[0,-22.05],"color":"amber","dashed":true,"width":1.4},{"type":"text","xy":[40.33,-11.03],"text":"depth","color":"amber","anchor":"start"},{"type":"text","xy":[19.1,3.21],"text":"surface dist.","color":"amber"},{"type":"text","xy":[22.84,-9.96],"text":"S = 44.1","color":"blue","anchor":"start"},{"type":"text","xy":[-1.6,-3.5],"text":"60°","color":"ink","anchor":"end"}]},"x":{"e":"Think of the beam as a ramp going down into the steel. The sound path (44.1 mm) is the long slanted side. You want the straight-down part, which is the depth.\n\nThe 60° is measured from the vertical line (the normal). The side next to the angle is the depth, so use cosine:\nDepth = S × cos θ = 44.1 × 0.5 = 22.1 mm. So C is right.\n\nThe sideways distance on the surface uses sine:\nSurface distance = 44.1 × sin 60° = 38.2 mm.\n\nMost common trap: B (38.2 mm). That is the surface distance, not th ound path at the back wall (T/cos θ), and 43.3 mm is T × tan θ, the half-skip distance to the back wall. The reflector is at 25 mm path, well short of that.\n\nMemory aid: the angle is from the normal, so surface distance uses sin, depth uses cos.","s":{"title":"60° shear wave, first leg","xlim":[-10,42],"ylim":[-30,10],"equal":true,"items":[{"type":"rect","xy":[-10,-25],"w":52,"h":25,"color":"steel","label":"Plate 25 mm"},{"type":"line","x":[0,0],"y":[0,-22],"color":"gray","dashed":true,"width":1},{"type":"line","x":[0,21.7],"y":[0,-12.5],"color":"blue","dashed":false,"width":3},{"type":"circle","xy":[21.7,-12.5],"r":1.2,"color":"red","fill":true},{"type":"arrow","from":[0,3],"to":[21.7,3],"color":"green"},{"type":"line","x":[21.7,21.7],"y":[0,-12.5],"color":"amber","dashed":true,"width":2},{"type":"text","xy":[10.8,5.5],"text":"Surface 21.7 mm","color":"green","size":9,"anchor":"middle"},{"type":"text","xy":[23.5,-6],"text":"Depth 12.5 mm","color":"amber","size":9,"anchor":"start"},{"type":"text","xy":[3,-9],"text":"S = 25 mm","color":"blue","size":9,"anchor":"start"},{"type":"text","xy":[1,-18],"text":"60° from normal","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[0,-2.5],"text":"Index","color":"ink","size":8,"anchor":"end"}]}}},{"t":"Angle-beam geometry","l":"II","k":"calc","q":"What is the full skip distance of a 60° probe on a 25 mm plate?","o":[["119 mm",0,"That value does not follow from the formula - re-check the steps."],["86.6 mm",1,""],["100.0 mm",0,"That is the V-path sound path (2T / cos θ), not the surface distance."],["43.3 mm",0,"That is the half skip (one leg). Full skip = 2 T tan θ."]],"s":"Skip distance = 2 T tan θ = 2 × 25 × tan 60° = 86.6 mm.\n(V-path sound path = 2T / cos θ = 100.0 mm.)","h":"One leg covers T tan θ along the surface; a full skip is two legs.","d":{"xlim":[-12.99,107.86],"ylim":[-37.12,15.59],"items":[{"type":"rect","xy":[-10.39,-25.0],"w":118.25,"h":25.0,"color":"steel"},{"type":"text","xy":[104.4,-20.67],"text":"plate T = 25 mm","color":"ink","anchor":"end","size":11},{"type":"rect","xy":[-8.66,0],"w":17.32,"h":10.39,"color":"wedge"},{"type":"line","x":[0,0],"y":[-25.0,1.73],"color":"gray","dashed":true,"width":1},{"type":"line","x":[0,43.3,86.6],"y":[0,-25.0,0],"color":"blue","width":2},{"type":"arrow","from":[0,4.33],"to":[86.6,4.33],"color":"amber"},{"type":"text","xy":[43.3,8.66],"text":"full skip = 2T tan θ","color":"amber"},{"type":"text","xy":[-2.6,-3.75],"text":"60°","color":"ink","anchor":"end"}]},"x":{"e":"Think of a ball bouncing off the floor and back up. The question asks how far along the top surface the beam travels before it lands again, not how far the sound travels.\n\nThe beam goes down 25 mm to the bottom. That is half a skip. Beam angle is measured from the vertical, so sideways distance = depth × tan 60° = 25 × 1.732 = 43.3 mm.\nThe beam then bounces up and travels the same sideways distance again.\n\nFull skip = 2 × T × tan θ = 2 × 25 × 1.732 = 86.6 mm (B).\n\nMost common trap: C, 100.0 mm. That is the sound path, 2T / cos θ = 50 / 0.5. It is the distance the sound really travels, along the slanted beam. It is longer than the surface distance. Use it for time-of-flight and screen calibration, but not for probe position.\n\nAlso watch D, 43.3 mm. It is only half a skip.\n\nRule: surface distance uses tan, sound path uses cos.","s":{"title":"Full skip, 60° probe, 25 mm plate","xlim":[-12,108],"ylim":[-36,18],"equal":false,"items":[{"type":"rect","xy":[0,-25],"w":100,"h":25,"color":"steel"},{"type":"rect","xy":[-8,0],"w":16,"h":5,"color":"wedge","label":"Probe"},{"type":"line","x":[0,43.3,86.6],"y":[0,-25,0],"color":"blue","dashed":false,"width":2},{"type":"line","x":[0,0],"y":[0,-25],"color":"gray","dashed":true,"width":1},{"type":"text","xy":[4,-10],"text":"60°","color":"amber","size":9},{"type":"text","xy":[-2,-12],"text":"T = 25 mm","color":"ink","size":9,"anchor":"end"},{"type":"arrow","from":[0,10],"to":[86.6,10],"color":"green"},{"type":"text", pe":"line","x":[0,19.0,38.0],"y":[0,-19.0,0],"color":"blue","width":2},{"type":"arrow","from":[0,1.9],"to":[38.0,1.9],"color":"amber"},{"type":"text","xy":[19.0,3.8],"text":"full skip = 2T tan θ","color":"amber"},{"type":"text","xy":[-1.14,-2.85],"text":"45°","color":"ink","anchor":"end"}]},"x":{"e":"Think of a ball bouncing off the floor and back up. The beam goes down to the back wall, then bounces back up to the top surface. The distance along the top between where it starts and where it lands is the full skip.\n\nAt 45°, the beam moves sideways exactly as far as it moves down. Going down 19 mm moves it 19 mm sideways, and the bounce back up adds another 19 mm. Total: 38 mm.\n\nRule: Full skip = 2 × T × tan θ = 2 × 19 × tan 45° = 38.0 mm.\n\nCommon trap: A (53.7 mm). That is the sound path, the distance the sound actually travels (2T / cos θ). Skip distance is measured along the surface, not along the beam. Sound path is always longer than skip distance, like a diagonal compared with a straight side.\n\nAlso watch C (19 mm). That is only the half skip, or the thickness, and it is the wrong answer.","s":{"title":"45° beam in 19 mm plate","xlim":[-12,56],"ylim":[-24,10],"equal":true,"items":[{"type":"rect","xy":[0,-19],"w":48,"h":19,"color":"steel","label":""},{"type":"rect","xy":[-9,0],"w":9,"h":4,"color":"wedge","label":"Probe"},{"type":"line","x":[0,19,38],"y":[0,-19,0],"color":"red","dashed":false,"width":2},{"type":"arrow","from":[0,7],"to":[38,7],"color":"blue"},{"type":"arrow","from":[38,7],"to":[0,7],"color":"blue"},{"type":"text","xy":[19,8.5],"text":"Full skip 38 mm","color":"blue","size":9,"anchor":"middle"},{"type":"text","xy":[19,-21.5],"text":"Bounce at back wall","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[31,-14],"text":"Sound path 53.7","color":"amber","size":9,"anchor":"start"},{"type":"text","xy":[-1,-9],"text":"T = 19 mm","color":"ink","size":9,"anchor":"end"}]}}},{"t":"Angle-beam geometry","l":"II","k":"calc","q":"What is the p.\nThe beam leaves the probe at 60° and hits the bottom of the plate. That is 12 mm straight down. Sideways it travels 12 × tan 60° = 20.8 mm. This is the half skip.\nThe beam then bounces and rises another 12 mm, moving sideways another 20.8 mm. The full skip is the sum of both legs.\n\nFormula: Skip distance = 2 T tan θ = 2 × 12 × 1.732 = 41.6 mm.\n\nCommon traps:\n• B (48.0 mm) is the sound path in the metal, 2T / cos θ. It is the distance the sound travels, not the distance along the surface. This is the most common mix-up.\n• A (20.8 mm) is only the half skip, one leg down.\n\nRule: surface distance uses tan. Sound path uses cos.","s":{"title":"Full skip of a 60° probe","xlim":[-10,48],"ylim":[-18,11],"equal":true,"items":[{"type":"rect","xy":[0,-12],"w":45,"h":12,"color":"steel"},{"type":"rect","xy":[-3,0],"w":6,"h":3,"color":"wedge","label":"Probe"},{"type":"line","x":[0,20.8],"y":[0,-12],"color":"blue","dashed":false,"width":2},{"type":"line","x":[20.8,41.6],"y":[-12,0],"color":"blue","dashed":false,"width":2},{"type":"line","x":[0,0],"y":[0,-12],"color":"gray","dashed":true,"width":1},{"type":"text","xy":[2,-6],"text":"60°","color":"amber","size":9,"anchor":"start"},{"type":"text","xy":[-1.5,-6],"text":"T = 12 mm","color":"ink","size":9,"anchor":"end"},{"type":"arrow","from":[0,6],"to":[41.6,6],"color":"green"},{"type":"text","xy":[20.8,8],"text":"Full skip 41.6 mm","color":"green","size":9,"anchor":"middle"},{"type":"text","xy":[10.4,-14.5],"text":"Half skip 20.8 mm","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[32,-14.5],"text":"Sound path 48.0 = trap","color":"red","size":9,"anchor":"middle"}]}}},{"t":"Angle-beam geometry","l":"II","k":"calc","q":"What is the full skip distance of a 70° probe on a 25 mm plate?","o":[["137 mm",1,""],["68.7 mm",0,"That is the half skip (one leg). Full skip = 2 T tan θ."],["47.0 mm",0,"Use tan θ: horizontal distance per leg = T tan θ."],["146 mm",0,"That is the V-path sound path (2T / cos θ), not the surfa red"},{"type":"text","xy":[-2.65,-3.75],"text":"60°","color":"ink","anchor":"end"}]},"x":{"e":"Think of a flashlight beam bouncing off a mirror. The plate's back wall is the mirror.\n\nStep 1: Pretend the beam does not bounce. It keeps going straight down. Its depth would be S cos θ = 81.5 × cos 60° = 40.8 mm.\n\nStep 2: That is deeper than the plate (25 mm). So the beam must have bounced and is now coming back up. This is the second leg.\n\nStep 3: Fold the extra distance back. The beam went 40.8 − 25 = 15.8 mm past the back wall in the unfolded picture. In the real plate it is 15.8 mm above the back wall.\n\nTrue depth = 2T − S cos θ = 50 − 40.8 = 9.2 mm.\n\nCommon trap: choosing D (40.8 mm). That is the unfolded depth, which is impossible in a 25 mm plate. The other trap is C (15.8 mm). That is the distance from the back wall, not from the top surface. Always ask whether the answer is bigger than T. If it is, fold it back.","s":{"title":"Second leg: fold the beam back","xlim":[-8,110],"ylim":[-48,10],"equal":true,"items":[{"type":"rect","xy":[-5,-25],"w":100,"h":25,"color":"steel"},{"type":"line","x":[0,43.3],"y":[0,-25],"color":"blue","width":2},{"type":"line","x":[43.3,70.7],"y":[-25,-9.2],"color":"blue","width":2},{"type":"line","x":[43.3,70.7],"y":[-25,-40.8],"color":"amber","dashed":true,"width":2},{"type":"circle","xy":[70.7,-9.2],"r":2,"color":"red","fill":true},{"type":"text","xy":[0,5],"text":"Probe 60°","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[-4,-23],"text":"Back wall","color":"ink","size":9,"anchor":"start"},{"type":"text","xy":[75,-9],"text":"Real: 9.2 mm","color":"red","size":9,"anchor":"start"},{"type":"text","xy":[75,-41],"text":"Unfolded: 40.8 mm","color":"amber","size":9,"anchor":"start"},{"type":"text","xy":[-4,-3],"text":"Top surface","color":"ink","size":9,"anchor":"start"}]}}},{"t":"Angle-beam geometry","l":"III","k":"calc","q":"A 45° probe on a 20 mm plate shows a reflector at a sound path of 41.7 mm. This is on the SE  wall. It is on the second leg.\nStep 3: Fold it back. The sound went 35.8 mm \"down\" on paper, but the plate is only 25 mm thick. The extra 10.8 mm is the climb back up.\n\nTrue depth = 2T − S cos θ = 50 − 35.8 = 14.2 mm.\n\nCommon traps:\n• B (35.8 mm) is the unfolded depth. This is the most common mistake: forgetting to fold it back, which puts the reflector below the plate.\n• A (10.8 mm) is the distance above the back wall, 35.8 − 25. It is a half-finished answer, because you must subtract it from T.\n\nQuick check: the answer must be less than T (25 mm). 14.2 mm is.","s":{"title":"Second leg: fold the depth back","xlim":[-12,118],"ylim":[-46,12],"equal":true,"items":[{"type":"rect","xy":[0,-25],"w":110,"h":25,"color":"steel","label":"25 mm plate"},{"type":"line","x":[0,68.7],"y":[0,-25],"color":"blue","dashed":false,"width":2},{"type":"line","x":[68.7,98.5],"y":[-25,-14.2],"color":"blue","dashed":false,"width":2},{"type":"line","x":[68.7,98.5],"y":[-25,-35.8],"color":"red","dashed":true,"width":2},{"type":"circle","xy":[98.5,-14.2],"r":2,"color":"green","fill":true},{"type":"text","xy":[0,5],"text":"70° probe","color":"ink","size":9,"anchor":"middle"},{"type":"text","xy":[68.7,-29],"text":"Back-wall bounce","color":"ink","size":8,"anchor":"middle"},{"type":"text","xy":[98.5,-41],"text":"Unfolded 35.8 (trap)","color":"red","size":9,"anchor":"middle"},{"type":"text","xy":[98.5,4],"text":"True 14.2 mm","color":"green","size":9,"anchor":"middle"}]}}},{"t":"Angle-beam geometry","l":"III","k":"calc","q":"A 60° probe on a 25 mm plate shows a reflector at a sound path of 74.5 mm. This is on the SECOND leg (after the back-wall bounce). What is its depth?","o":[["37.3 mm",0,"S cos θ = 37.3 mm is deeper than the plate - the beam has already bounced. On the 2nd leg depth = 2T − S cos θ."],["12.7 mm",1,""],["17.5 mm",0,"That value does not follow from the formula - re-check the steps."],["12.3 mm",0,"That is the distance ABOVE the back wall measured wrongly; depth = 2T − plate and back once.\nWe want B1 to arrive before F2, so they don't mix.\nAt the limit, the water round trip equals the aluminum round trip:\n2·WP / 1.48 = 2·50 / 6.32 = 15.8 µs\nSo WP ≥ T × v_water / v_part = 50 × 1.48 / 6.32 = 11.7 mm.\nTrap: the ratio flips easily. 50 × 6.32 / 1.48 = 214 mm (D) is the upside-down ratio. Sound is much slower in water, so you need LESS water than plate thickness. Dropping the round-trip factor gives half the answer (5.9 mm, A).","s":{"title":"Echo timeline at minimum water path","xlim":[-3,38],"ylim":[-4,7],"equal":false,"items":[{"type":"line","x":[0,36],"y":[0,0],"color":"gray","dashed":false,"width":2},{"type":"arrow","from":[0,0],"to":[0,5],"color":"amber"},{"type":"text","xy":[0,5.7],"text":"Pulse","color":"amber","size":9,"anchor":"middle"},{"type":"arrow","from":[15.8,0],"to":[15.8,4],"color":"blue"},{"type":"text","xy":[15.8,4.7],"text":"F1","color":"blue","size":9,"anchor":"middle"},{"type":"arrow","from":[31.6,0],"to":[31.6,3],"color":"green"},{"type":"text","xy":[30.6,3.5],"text":"B1","color":"green","size":9,"anchor":"end"},{"type":"arrow","from":[31.6,3],"to":[31.6,5],"color":"red"},{"type":"text","xy":[31.6,5.7],"text":"F2","color":"red","size":9,"anchor":"middle"},{"type":"arrow","from":[0,-1.5],"to":[15.8,-1.5],"color":"blue"},{"type":"arrow","from":[15.8,-1.5],"to":[31.6,-1.5],"color":"green"},{"type":"text","xy":[7.9,-2.8],"text":"Water 15.8 µs","color":"blue","size":8,"anchor":"middle"},{"type":"text","xy":[23.7,-2.8],"text":"Aluminum 15.8 µs","color":"green","size":8,"anchor":"middle"}]}}},{"t":"Immersion testing","l":"II","k":"calc","q":"In immersion testing of a 25 mm steel plate (v_L = 5.92 mm/µs, water 1.48 mm/µs), what is the MINIMUM water path so the second front-surface echo arrives after the first back-wall echo?","o":[["25.0 mm",0,"Equal distances are not equal times - sound is about 4× slower in water."],["6.2 mm",1,""],["100 mm",0,"Ratio flipped. The water path must take as long as the plate: WP = T × v_water / v_part."],["3.1 mm",0,"Both paths are round trips, so the factor 2 cancels."]],"s":"Time in the part (round trip) = 2T / v_part; time between interface echoes = 2 WP / v_water.\nWP ≥ T × v_water / v_part = 25 × 1.48 / 5.92 = 6.2 mm  (≈ T/4 for steel).","h":"Make the water round trip at least as long (in time) as the part round trip.","d":null,"x":{"e":"Think of an echo like a shout in a canyon. Each round trip takes time.\nThe sound goes into the water, hits the plate and returns: that is front echo 1, at 2·WP/v_water.\nThe sound that enters the plate takes a round trip in steel to the back wall and returns. That adds 2·T/v_steel.\nThe sound that bounced off the front surface goes back up to the probe, reflects, and comes down again. That is front echo 2, which adds one more water round trip, 2·WP/v_water.\nWe don't want front echo 2 to land on top of the back-wall echo. So the extra water trip must be at least as long as the steel trip:\n2·WP/v_water ≥ 2·T/v_steel\nWP ≥ T × v_water/v_steel = 25 × 1.48/5.92 = 6.2 mm (about T/4 for steel).\nCheck: 8.4 µs in water and 8.4 µs in steel.\n\nCommon traps: 100 mm comes from flipping the ratio (water is slower, so you need less water, not more). 3.1 mm comes from forgetting that echo 2 needs a full extra round trip. 25 mm comes from setting WP = T.","s":{"title":"Echo timeline (WP = 6.2 mm)","xlim":[-1,22],"ylim":[-3.5,8],"equal":false,"items":[{"type":"line","x":[0,21],"y":[0,0],"color":"gray","dashed":false,"width":2},{"type":"line","x":[8.4,8.4],"y":[0,6],"color":"blue","dashed":false,"width":3},{"type":"line","x":[16.8,16.8],"y":[0,4],"color":"red","dashed":false,"width":3},{"type":"line","x":[16.8,16.8],"y":[0,6],"color":"green","dashed":true,"width":2},{"type":"text","xy":[8.4,6.7],"text":"Front echo 1","color":"blue","size":9,"anchor":"middle"},{"type":"text","xy":[16.2,3.2],"text":"Back wall 1","color":"red","size":9,"anchor":"end"},{"type":"text","xy":[17.2,6.7],"text":"Front echo 2","color":"green","siz
